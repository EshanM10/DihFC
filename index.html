            {/* 3. P2P TRANSFER MARKET */}

                <div className="lg:col-span-8 grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {allMarketListings.map((item) => {

                    const isMine = item.sellerKey === accountKey;

                    return (
                      <div key={item.id} className="pixel-panel p-3.5 flex items-center gap-3.5">

                        <div className="flex-1 min-w-0 flex flex-col gap-1.5">
                          <div className="text-xs font-bold text-white truncate">{card.name}</div>
                          <div className="text-[11px] text-slate-400">

                          <div className="text-xs font-bold text-sky-400 tabular-nums">{item.priceShards} SHARDS</div>
                          {isMine ? (
                            <button
                              type="button"
                              onClick={() => {
                                onCancelMarketListing(item);
                                showMsg(`Cancelled listing and returned ${card.name} to club.`);
                              }}
                              className="px-3 py-1.5 bg-rose-600 text-white text-[11px] font-bold pixel-btn self-start"
                            >
                              CANCEL LISTING
                            </button>
                          ) : (
                            <button
                              type="button"
                              disabled={!canBuy}
                              onClick={() => {
                                onBuyMarketListing(item);
                                showMsg(`Bought ${card.name} from @${item.sellerName} for ${item.priceShards} Shards!`);
                              }}
                              className="px-3 py-1.5 bg-sky-400 text-slate-950 text-[11px] font-bold pixel-btn self-start"
                            >
                              BUY {item.priceShards} SH
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* 4. P2P PLAYER TRADES */}
            {subTab === 'TRADES' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-5 pixel-panel p-4 flex flex-col gap-3 self-start">
                  <div className="font-arcade text-xs text-emerald-400">PROPOSE PLAYER TRADE</div>
                  <p className="font-vt text-lg text-slate-300">

                  <div className="max-h-48 overflow-y-auto flex flex-col gap-1.5 p-2 bg-slate-950 border border-slate-700">
                    {spareOwnedCards.length === 0 ? (
                      <div className="text-xs text-slate-400 p-2">No spare cards outside your Starting XI.</div>

                      spareOwnedCards.map(({ card, count }) => {

                          <button
                            key={card.id}
                            type="button"
                            onClick={() => {

                                  : prev.length >= 2
                                  ? prev
                                  : [...prev, card.id]

                            className={`px-2.5 py-1.5 text-left text-xs border flex items-center justify-between ${
                              checked ? 'bg-emerald-500/20 border-emerald-400 text-emerald-300 font-bold' : 'border-slate-800 text-slate-300'
                            }`}
                          >
                            <span>{card.name} ({card.ovr} {card.pos})</span>
                            <span>{checked ? 'OFFERED' : `x${count}`}</span>
                          </button>

                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label htmlFor="trd-sh" className="block text-[11px] text-slate-300 mb-1">Shard Sweetener</label>
                      <input
                        id="trd-sh"
                        type="number"
                        min={0}
                        max={save.shards}
                        value={tradeShardAdd}
                        onChange={(e) => setTradeShardAdd(e.target.value)}
                        className="w-full px-2.5 py-1.5 bg-slate-950 border border-slate-700 text-xs text-white tabular-nums"
                      />
                    </div>
                    <div>
                      <label htmlFor="trd-note" className="block text-[11px] text-slate-300 mb-1">Wanted Note</label>
                      <input
                        id="trd-note"
                        type="text"
                        maxLength={48}
                        value={tradeWantedNote}
                        onChange={(e) => setTradeWantedNote(e.target.value)}
                        className="w-full px-2.5 py-1.5 bg-slate-950 border border-slate-700 text-xs text-white"
                      />
                    </div>
                  </div>

                  <button
                    type="button"
                    disabled={tradeOfferIds.length === 0 || (parseInt(tradeShardAdd, 10) || 0) > save.shards}
                    onClick={() => {
                      const sh = Math.max(0, Math.min(save.shards, parseInt(tradeShardAdd, 10) || 0));
                      const created = onCreateTradeOffer(tradeOfferIds, sh, tradeWantedNote);
                      setTradeOfferIds([]);
                      setTradeShardAdd('0');
                      showMsg(`Trade Offer ${created.id} posted!`);
                    }}
                    className="py-2.5 bg-emerald-500 text-slate-950 font-arcade text-xs pixel-btn"
                  >
                    CREATE TRADE OFFER
                  </button>
                </div>

                <div className="lg:col-span-7 flex flex-col gap-3">
                  <div className="pixel-panel p-3 flex items-center gap-2">
                    <input
                      type="text"
                      value={tradeCodeLookup}
                      onChange={(e) => setTradeCodeLookup(e.target.value)}

                      aria-label="Search player trade offers"
                      className="flex-1 px-3 py-1.5 bg-slate-950 border border-slate-700 text-xs text-white"
                    />
                  </div>

                  {visibleTrades.map((offer) => {
                    const isMine = offer.proposerKey === accountKey;
                    const isAccepting = acceptingTradeId === offer.id;
                    const offeredCards = (offer.offeredCardIds || []).map((id) => CARD_BY_ID[id]).filter(Boolean);
                    const minOvr = offer.minReturnOvr || 50;
                    return (
                      <div key={offer.id} className="pixel-panel p-4 flex flex-col gap-3">
                        <div className="flex flex-wrap items-center justify-between gap-2">
                          <div>
                            <span className="font-arcade text-xs text-amber-300">{offer.id}</span>
                            <span className="ml-2 text-xs text-slate-400">

                          {offer.offeredShards > 0 && (

                        <div className="flex flex-wrap gap-3 items-center">

                            SELECT CARDS TO TRADE

      }

      /* =========================================================================
         10. MAIN APPLICATION SHELL
      ========================================================================= */
      const DEFAULT_SAVE = {
        clubName: 'PIXEL KICK FC',
        coins: 600,
        shards: 120,
        elo: 1000,
        wins: 0,
        losses: 0,
        formation: '4-3-3',
        tactics: { ...DEFAULT_TACTICS },
        theme: 'arcade-obsidian',
        fontId: 'silkscreen',
        inventory: {
          p446: 1, p447: 1, p448: 1, p449: 1, p450: 1, p451: 1, p452: 1, p453: 1,
          p413: 1, p390: 1, p374: 1, p382: 1, p389: 1, p381: 1,
          p512: 1, p277: 1, p515: 1,
        },
        squadIds: ['p413', 'p512', 'p390', 'p448', 'p374', 'p277', 'p450', 'p382', 'p389', 'p381', 'p515'],
        discoveredIds: [
          'p446', 'p447', 'p448', 'p449', 'p450', 'p451', 'p452', 'p453',
          'p413', 'p390', 'p374', 'p382', 'p389', 'p381',
          'p512', 'p277', 'p515',
        ],
        scanlines: true,
        muted: false,
      };

      const STORAGE_KEY = 'pixel_kick_fc_save_v1';
      const FB_STORAGE_KEY = 'pixel_kick_fc_fb_cfg_v1';

      function sanitizeSave(rawSave) {
        const merged = { ...DEFAULT_SAVE, ...(rawSave || {}) };
        merged.shards = Number.isFinite(Number(merged.shards)) ? Math.max(0, Number(merged.shards)) : DEFAULT_SAVE.shards;
        merged.tactics = { ...DEFAULT_TACTICS, ...(merged.tactics || {}) };
        merged.theme = THEMES.some((t) => t.id === merged.theme) ? merged.theme : DEFAULT_SAVE.theme;
        merged.fontId = FONT_PACKS.some((f) => f.id === merged.fontId) ? merged.fontId : DEFAULT_SAVE.fontId;
        if (Object.keys(CARD_BY_ID).length === 0) return merged;

        const cleanInv = {};
        Object.entries(merged.inventory || {}).forEach(([id, count]) => {
          if (CARD_BY_ID[id] && count > 0) cleanInv[id] = count;
        });

        let hasAnyOwned = Object.keys(cleanInv).length > 0;
        if (!hasAnyOwned) {
          Object.assign(cleanInv, DEFAULT_SAVE.inventory);
        }

        const usedInSquad = new Set();
        const cleanSquad = (Array.isArray(merged.squadIds) ? merged.squadIds : DEFAULT_SAVE.squadIds).map((id, idx) => {
          if (CARD_BY_ID[id] && (cleanInv[id] || 0) > 0 && !usedInSquad.has(id)) {
            usedInSquad.add(id);
            return id;
          }
          const defId = DEFAULT_SAVE.squadIds[idx];
          if (CARD_BY_ID[defId] && !usedInSquad.has(defId)) {
            cleanInv[defId] = cleanInv[defId] || 1;
            usedInSquad.add(defId);
            return defId;
          }
          const fallback = Object.keys(cleanInv).find((cid) => !usedInSquad.has(cid)) || PLAYER_POOL[0]?.id;
          if (fallback) {
            cleanInv[fallback] = cleanInv[fallback] || 1;
            usedInSquad.add(fallback);
          }
          return fallback;
        });

        const discSet = new Set(
          (Array.isArray(merged.discoveredIds) ? merged.discoveredIds : []).filter((id) => Boolean(CARD_BY_ID[id]))
        );
        Object.keys(cleanInv).forEach((id) => discSet.add(id));

        return {
          ...merged,
          inventory: cleanInv,
          squadIds: cleanSquad,
          discoveredIds: Array.from(discSet),
        };
      }

      function loadInitialSave() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return DEFAULT_SAVE;
          const parsed = JSON.parse(raw);
          return sanitizeSave(parsed);
        } catch {
          return DEFAULT_SAVE;
        }
      }

      function App() {
        const autostart = useMemo(() => new URLSearchParams(window.location.search).get('autostart') === '1', []);
        const [screenState, setScreenState] = useState(autostart ? 'playing' : 'title'); // 'title' | 'playing'
        const [activeTab, setActiveTab] = useState('LOBBY'); // 'LOBBY' | 'PACKS' | 'SQUAD' | 'PLAY' | 'SBC' | 'ALBUM' | 'LADDER'

        const [fbConnected, setFbConnected] = useState(false);
        const [fbError, setFbError] = useState('');
        const [showFbModal, setShowFbModal] = useState(false);
        const fbDbRef = useRef(null);

        // Pack & Walkout State
        const [shakingPack, setShakingPack] = useState(null);

        // Squad Builder State & Filters
        const [selectedSlot, setSelectedSlot] = useState(null);
        const [inspectedCard, setInspectedCard] = useState(null);
        const [squadSearch, setSquadSearch] = useState('');
        const [squadTierFilter, setSquadTierFilter] = useState('ALL');
        const [squadRoleFilter, setSquadRoleFilter] = useState('ALL');

        // Active Match / Game Mode State
        const [activeMatch, setActiveMatch] = useState(null); // { mode, homeName, awayName, homeSquad, awaySquad, awayKit, seed, rewardCoins, isRanked, roomCode }
        const [matchPaused, setMatchPaused] = useState(false);

        // Retro Draft State
        const [draftState, setDraftState] = useState(null); // { step: 'MANAGER'|'PICK'|'BRACKET', manager, roundIdx, options, picked, bracketRound }

        // Penalty Shootout State
        const [penaltyActive, setPenaltyActive] = useState(false);

        // SBC State & Filters
        const [selectedSbcId, setSelectedSbcId] = useState(SBC_CHALLENGES[0].id);
        const [sbcSelectedIds, setSbcSelectedIds] = useState([]);
        const [sbcSearch, setSbcSearch] = useState('');

        // Album Binder Filters
        const [albumSearch, setAlbumSearch] = useState('');

        const [albumStatusFilter, setAlbumStatusFilter] = useState('ALL'); // 'ALL' | 'FOUND' | 'MISSING'
        const [albumExpandedTiers, setAlbumExpandedTiers] = useState({});

        // Hydrate from ./players.json when served over HTTP/HTTPS
        useEffect(() => {
          if (window.location.protocol === 'file:') return;
          fetch('./players.json')
            .then((res) => (res.ok ? res.json() : null))
            .then((data) => {
              if (Array.isArray(data) && data.length > 0) {

                setSave((prev) => sanitizeSave(prev));
              }
            })

        }, []);

        // Leaderboard State
        const [remoteLeaders, setRemoteLeaders] = useState([]);

        // Sync body dataset, theme, font & audio mute
        useEffect(() => {
          document.body.dataset.state = matchPaused ? 'paused' : matchResultModal ? 'gameover' : screenState;
        }, [screenState, matchPaused, matchResultModal]);

        useEffect(() => {

            localStorage.setItem(STORAGE_KEY, JSON.stringify(save));

        }, [save]);

        // Persist session in localStorage
        useEffect(() => {
          try {
            if (currentUser) {

            } else {
              localStorage.removeItem(SESSION_STORAGE_KEY);
            }
          } catch {}
        }, [currentUser]);

        // Debounced cloud save sync when signed into an account
        useEffect(() => {
          if (!currentUser?.usernameKey) return;
          const timer = setTimeout(() => {
            if (fbDbRef.current && fbConnected) {
              fbDbRef.current.ref(`users/${currentUser.usernameKey}/save`).set(save).catch(() => {});
            } else {
              try {
                const raw = localStorage.getItem(LOCAL_ACCOUNTS_KEY);
                const accounts = raw ? JSON.parse(raw) : {};
                if (accounts[currentUser.usernameKey]) {
                  accounts[currentUser.usernameKey].save = save;
                  localStorage.setItem(LOCAL_ACCOUNTS_KEY, JSON.stringify(accounts));
                }
              } catch {}
            }
          }, 450);
          return () => clearTimeout(timer);
        }, [save, currentUser, fbConnected]);

        // Initialize Firebase if config present
        useEffect(() => {
          if (!fbConfig || !window.firebase) {
            setFbConnected(false);
            setFbError('');
            fbDbRef.current = null;
            return;
          }
          try {
            setFbError('');
            const appName = `pkfc_${(fbConfig.projectId || 'custom').replace(/[^a-zA-Z0-9_-]/g, '_')}`;
            const existing = window.firebase.apps.find((a) => a.name === appName);
            const app = existing || window.firebase.initializeApp(fbConfig, appName);
            const db = window.firebase.database(app);
            fbDbRef.current = db;
            setFbConnected(true);

            // Sync signed-in user's cloud save if available
            if (currentUser?.usernameKey) {
              db.ref(`users/${currentUser.usernameKey}/save`).once('value').then((snap) => {
                const remoteSave = snap.val();
                if (remoteSave && typeof remoteSave === 'object') {
                  setSave(sanitizeSave(remoteSave));
                }
              }).catch(() => {});
            }

            const lbRef = db.ref('leaderboard').orderByChild('elo').limitToLast(15);
            const handler = (snap) => {
              const val = snap.val() || {};
              const list = Object.entries(val)
                .map(([key, item]) => ({ accountKey: key, ...item }))
                .sort((a, b) => b.elo - a.elo);
              setRemoteLeaders(list);
              setFbError('');
            };
            const errHandler = (err) => {
              const msg = err && err.message ? err.message : 'Database read failed.';
              setFbError(
                msg.toLowerCase().includes('permission')
                  ? 'Firebase RTDB permission denied — set Realtime Database rules to allow read/write for users, rooms & leaderboard.'
                  : msg
              );
            };
            lbRef.on('value', handler, errHandler);

            // Live P2P Market Listings & Player Trade Offers
            const mktRef = db.ref('marketListings').limitToLast(40);
            const onMkt = (snap) => {
              const val = snap.val() || {};
              const arr = Object.entries(val)
                .map(([id, item]) => ({ id, ...item }))
                .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
              setMarketListings(arr);
            };
            mktRef.on('value', onMkt);

            const trdRef = db.ref('tradeOffers').limitToLast(40);
            const onTrd = (snap) => {
              const val = snap.val() || {};
              const arr = Object.entries(val)
                .map(([id, item]) => ({ id, ...item }))
                .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
              setTradeOffers(arr);
            };
            trdRef.on('value', onTrd);

            // Auto-claim P2P Market Shard payouts & completed Trade return cards
            const myKey = currentUser?.usernameKey || guestId;
            const mClaimRef = db.ref(`marketClaims/${myKey}`);
            const onMClaim = (snap) => {
              const val = snap.val();
              if (!val) return;
              let gainedShards = 0;
              Object.values(val).forEach((c) => {
                gainedShards += Number(c?.shards || 0);
              });
              if (gainedShards > 0) {
                setSave((prev) => ({ ...prev, shards: prev.shards + gainedShards }));
              }
              mClaimRef.remove().catch(() => {});
            };
            mClaimRef.on('value', onMClaim);

            const tClaimRef = db.ref(`tradeClaims/${myKey}`);
            const onTClaim = (snap) => {
              const val = snap.val();
              if (!val) return;
              const addIds = [];
              let addShards = 0;
              Object.values(val).forEach((c) => {
                if (Array.isArray(c?.cardIds)) addIds.push(...c.cardIds);
                addShards += Number(c?.shards || 0);
              });
              if (addIds.length > 0 || addShards > 0) {
                setSave((prev) => {
                  const nextInv = { ...prev.inventory };
                  const nextDisc = new Set(prev.discoveredIds);
                  addIds.forEach((cid) => {
                    if (CARD_BY_ID[cid]) {
                      nextInv[cid] = (nextInv[cid] || 0) + 1;
                      nextDisc.add(cid);
                    }
                  });
                  return {
                    ...prev,
                    shards: prev.shards + addShards,
                    inventory: nextInv,
                    discoveredIds: Array.from(nextDisc),
                  };
                });
              }
              tClaimRef.remove().catch(() => {});
            };
            tClaimRef.on('value', onTClaim);

            return () => {
              lbRef.off('value', handler);
              mktRef.off('value', onMkt);
              trdRef.off('value', onTrd);
              mClaimRef.off('value', onMClaim);
              tClaimRef.off('value', onTClaim);
            };
          } catch (err) {
            setFbConnected(false);
            setFbError(err && err.message ? err.message : 'Failed to initialize Firebase.');
          }
        }, [fbConfig, currentUser?.usernameKey, guestId]);

        // Gyroscope tilt support for holographic sheen
        useEffect(() => {
          const onOrient = (e) => {
            if (e.gamma == null || e.beta == null) return;
            const mx = Math.max(0, Math.min(100, 50 + e.gamma * 1.2));
            const my = Math.max(0, Math.min(100, 50 + (e.beta - 35) * 1.2));
            document.documentElement.style.setProperty('--mx', `${mx.toFixed(1)}%`);
            document.documentElement.style.setProperty('--my', `${my.toFixed(1)}%`);
          };
          window.addEventListener('deviceorientation', onOrient);
          return () => window.removeEventListener('deviceorientation', onOrient);
        }, []);

        // Keyboard bindings: Enter/Space on title, P/Escape during match
        useEffect(() => {
          const onKey = (e) => {
            if (screenState === 'title' && (e.key === 'Enter' || e.key === ' ')) {
              e.preventDefault();
              audioFX.playClick();
              setScreenState('playing');
              document.body.dataset.state = 'playing';
              return;
            }
            if (activeMatch && (e.key === 'p' || e.key === 'P' || e.key === 'Escape')) {
              e.preventDefault();
              setMatchPaused((p) => !p);
            }
          };
          window.addEventListener('keydown', onKey);
          return () => window.removeEventListener('keydown', onKey);
        }, [screenState, activeMatch]);

        const squadCards = useMemo(
          () => save.squadIds.map((id) => CARD_BY_ID[id] || PLAYER_POOL[0]),
          [save.squadIds, poolVersion]
        );

        const chemReport = useMemo(
          () => calculateSquadChemistry(squadCards, save.formation),
          [squadCards, save.formation]
        );

        const division = getDivisionFromElo(save.elo);

        const ownedCardsList = useMemo(() => {
          return Object.entries(save.inventory)
            .filter(([, count]) => count > 0)
            .map(([id, count]) => ({ card: CARD_BY_ID[id], count }))
            .filter((x) => Boolean(x.card))
            .sort((a, b) => b.card.ovr - a.card.ovr);
        }, [save.inventory, poolVersion]);

        const matchesCardQuery = useCallback((card, query) => {
          const q = query.trim().toLowerCase();
          if (!q) return true;
          const nationName = (NATIONS[card.nation]?.name || '').toLowerCase();
          return (
            card.name.toLowerCase().includes(q) ||
            card.club.toLowerCase().includes(q) ||
            card.league.toLowerCase().includes(q) ||
            card.nation.toLowerCase().includes(q) ||
            nationName.includes(q) ||
            card.pos.toLowerCase().includes(q)
          );
        }, []);

        const filteredSquadCards = useMemo(() => {
          return ownedCardsList.filter(({ card }) => {
            if (squadTierFilter !== 'ALL' && card.tier !== squadTierFilter) return false;
            if (squadRoleFilter !== 'ALL' && getPositionGroup(card.pos) !== squadRoleFilter) return false;
            return matchesCardQuery(card, squadSearch);
          });
        }, [ownedCardsList, squadTierFilter, squadRoleFilter, squadSearch, matchesCardQuery]);

        const filteredSbcCards = useMemo(() => {
          return ownedCardsList.filter(({ card }) => {
            if (sbcTierFilter !== 'ALL' && card.tier !== sbcTierFilter) return false;
            return matchesCardQuery(card, sbcSearch);
          });
        }, [ownedCardsList, sbcTierFilter, sbcSearch, matchesCardQuery]);

        /* --- Handlers --- */
        const handleStartGame = () => {
          audioFX.playClick();
          setScreenState('playing');
          document.body.dataset.state = 'playing';
        };

        const handleOpenPack = (packDef, freeReward = false) => {
          if (!freeReward && save.coins < packDef.cost) return;
          audioFX.playPackShake();
          setShakingPack(packDef.id);
          if (!freeReward) {
            setSave((prev) => ({ ...prev, coins: prev.coins - packDef.cost }));
          }
          setTimeout(() => {
            audioFX.playPackTear();
            const rng = createSeededRng(Date.now() ^ Math.floor(Math.random() * 99999));
            const res = rollPackCards(packDef.id, rng);
            setShakingPack(null);
            setWalkoutResult(res);
          }, 950);
        };

        const handleClaimPack = () => {
          if (!walkoutResult) return;
          setSave((prev) => {
            const nextInv = { ...prev.inventory };
            const nextDisc = new Set(prev.discoveredIds);
            walkoutResult.cards.forEach((c) => {
              nextInv[c.id] = (nextInv[c.id] || 0) + 1;
              nextDisc.add(c.id);
            });
            return {
              ...prev,
              inventory: nextInv,
              discoveredIds: Array.from(nextDisc),
            };
          });
          setWalkoutResult(null);
        };

        const handleAssignPlayerToSlot = (cardId) => {
          if (selectedSlot === null) {
            setInspectedCard(CARD_BY_ID[cardId]);
            return;
          }
          audioFX.playClick();
          setSave((prev) => {
            const nextSquad = [...prev.squadIds];
            const existingIdx = nextSquad.indexOf(cardId);
            if (existingIdx !== -1) {
              const temp = nextSquad[selectedSlot];
              nextSquad[selectedSlot] = cardId;
              nextSquad[existingIdx] = temp;
            } else {
              nextSquad[selectedSlot] = cardId;
            }
            return { ...prev, squadIds: nextSquad };
          });
          setSelectedSlot(null);
        };

        const handleAutoBestXI = () => {
          audioFX.playClick();
          const slots = FORMATIONS[save.formation];
          const available = ownedCardsList.map((o) => o.card);
          const used = new Set();
          const nextSquad = new Array(11).fill(null);

          // Pass 1: Strict GK slot first, then exact position matches for outfield
          slots.forEach((slot, idx) => {
            if (slot.role === 'GK') {
              const gk = available.find((c) => !used.has(c.id) && c.pos === 'GK');
              if (gk) {
                used.add(gk.id);
                nextSquad[idx] = gk.id;
              }
            } else {
              const exact = available.find((c) => !used.has(c.id) && c.pos === slot.pos);
              if (exact) {
                used.add(exact.id);
                nextSquad[idx] = exact.id;
              }
            }
          });

          // Pass 2: Outfield Shapeshifter upgrade or role-group fill
          slots.forEach((slot, idx) => {
            if (slot.role === 'GK') return;
            const current = nextSquad[idx] ? CARD_BY_ID[nextSquad[idx]] : null;
            const betterShapeshifter = available.find(
              (c) =>
                !used.has(c.id) &&
                c.tier === 'shapeshifter' &&
                c.pos !== 'GK' &&
                (!current || c.ovr > current.ovr)
            );
            if (betterShapeshifter) {
              if (current) used.delete(current.id);
              used.add(betterShapeshifter.id);
              nextSquad[idx] = betterShapeshifter.id;
            } else if (!nextSquad[idx]) {
              const groupMatch = available.find((c) => !used.has(c.id) && getPositionGroup(c.pos) === slot.role);
              if (groupMatch) {
                used.add(groupMatch.id);
                nextSquad[idx] = groupMatch.id;
              }
            }
          });

          // Pass 3: Any remaining unfilled slots get highest remaining OVR
          slots.forEach((slot, idx) => {
            if (!nextSquad[idx]) {
              const fallback = available.find((c) => !used.has(c.id));
              if (fallback) {
                used.add(fallback.id);
                nextSquad[idx] = fallback.id;
              }
            }
          });

          setSave((prev) => ({
            ...prev,
            squadIds: nextSquad.map((id, idx) => id || prev.squadIds[idx]),
          }));
        };

        const launchMatch = ({
          mode,
          awayName,
          awaySquad,
          awayFormation = '4-3-3',
          awayTactics = DEFAULT_TACTICS,
          awayBoost = 0,
          awayKit = '#ef4444',
          rewardCoins = 500,
          rewardShards = 12,
          isRanked = false,
          roomCode = null,
          seed = null,
          homeSquadOverride = null,
          homeFormationOverride = null,
        }) => {
          audioFX.playClick();
          setMatchPaused(false);
          setPauseTacticsOpen(false);
          setMatchResultModal(null);
          setActiveMatch({
            mode,
            homeName: save.clubName,
            awayName,
            homeSquad: homeSquadOverride || squadCards,
            homeFormation: homeFormationOverride || save.formation,
            awaySquad,
            awayFormation,
            awayTactics,
            awayBoost,
            awayKit,
            seed: seed || Math.floor(Math.random() * 1000000),
            rewardCoins,
            rewardShards,
            isRanked,
            roomCode,
          });
        };

        const accountKey = currentUser ? currentUser.usernameKey : guestId;

        /* --- Market & Trade Handlers --- */
        const removeOneCardFromClub = (prevSave, cardId) => {
          const nextInv = { ...prevSave.inventory };
          const curCount = nextInv[cardId] || 0;
          if (curCount > 1) nextInv[cardId] = curCount - 1;
          else delete nextInv[cardId];

          let nextSquad = [...prevSave.squadIds];
          if (!nextInv[cardId] && nextSquad.includes(cardId)) {
            const idx = nextSquad.indexOf(cardId);
            const fallback = Object.keys(nextInv).find((id) => !nextSquad.includes(id)) || PLAYER_POOL[0]?.id;
            if (fallback) {
              nextInv[fallback] = nextInv[fallback] || 1;
              nextSquad[idx] = fallback;
            }
          }
          return { nextInv, nextSquad };
        };

        const handleSignCard = (card, costShards) => {
          if (!card || save.shards < costShards) return;
          audioFX.playClick();
          setSave((prev) => {
            const nextInv = { ...prev.inventory, [card.id]: (prev.inventory[card.id] || 0) + 1 };
            const nextDisc = prev.discoveredIds.includes(card.id) ? prev.discoveredIds : [...prev.discoveredIds, card.id];
            return {
              ...prev,
              shards: prev.shards - costShards,
              inventory: nextInv,
              discoveredIds: nextDisc,
            };
          });
        };

        const handleSellCardForShards = (card, gainShards) => {
          if (!card || (save.inventory[card.id] || 0) <= 0) return;
          audioFX.playClick();
          setSave((prev) => {
            const { nextInv, nextSquad } = removeOneCardFromClub(prev, card.id);
            return {
              ...prev,
              shards: prev.shards + gainShards,
              inventory: nextInv,
              squadIds: nextSquad,
            };
          });
        };

        const persistLocalMarket = (list) => {
          setMarketListings(list);
          try { localStorage.setItem(LOCAL_MARKET_KEY, JSON.stringify(list)); } catch {}
        };

        const persistLocalTrades = (list) => {
          setTradeOffers(list);
          try { localStorage.setItem(LOCAL_TRADES_KEY, JSON.stringify(list)); } catch {}
        };

        const handleCreateMarketListing = (cardId, priceShards) => {
          if (!cardId || (save.inventory[cardId] || 0) <= 0) return;
          audioFX.playClick();
          const listing = {
            id: `MKT-${randomSaltHex().slice(0, 6).toUpperCase()}`,
            cardId,
            sellerKey: accountKey,
            sellerName: currentUser?.username || save.clubName,
            priceShards,
            createdAt: Date.now(),
          };
          setSave((prev) => {
            const { nextInv, nextSquad } = removeOneCardFromClub(prev, cardId);
            return { ...prev, inventory: nextInv, squadIds: nextSquad };
          });
          if (fbDbRef.current && fbConnected) {
            fbDbRef.current.ref(`marketListings/${listing.id}`).set(listing).catch(() => {});
          } else {
            persistLocalMarket([listing, ...marketListings]);
          }
        };

        const handleCancelMarketListing = (listing) => {
          if (!listing || listing.sellerKey !== accountKey) return;
          audioFX.playClick();
          setSave((prev) => ({
            ...prev,
            inventory: { ...prev.inventory, [listing.cardId]: (prev.inventory[listing.cardId] || 0) + 1 },
          }));
          if (fbDbRef.current && fbConnected) {
            fbDbRef.current.ref(`marketListings/${listing.id}`).remove().catch(() => {});
          } else {
            persistLocalMarket(marketListings.filter((x) => x.id !== listing.id));
          }

        const handleBuyMarketListing = (listing) => {

              discoveredIds: nextDisc,

        const handleAcceptTradeOffer = (offer, returnCardIds) => {

              inventory: nextInv,
              squadIds: nextSquad,

        const handleRegisterAccount = async ({ username, password, clubName }) => {

            cleanClub && cleanClub !== 'PIXEL KICK FC' ? cleanClub : display.toUpperCase().slice(0, 20);

          const userRecord = {

          if (fbDbRef.current && fbConnected) {
            const uRef = fbDbRef.current.ref(`users/${key}`);

            if (snap.exists()) {
              throw new Error('Username already taken. Pick another or Sign In.');

            await uRef.set(userRecord);
            fbDbRef.current.ref(`leaderboard/${key}`).set({

              throw new Error('Username already taken. Pick another or Sign In.');

            throw new Error('Account not found. Check username or Create Account.');

                            <thead>
                              <tr className="border-b-2 border-slate-700 text-slate-400">
                                <th className="py-2 pr-2">#</th>
                                <th className="py-2 pr-2">CLUB</th>
                                <th className="py-2 pr-2">OVR</th>
                                <th className="py-2 pr-2">W-L</th>
                                <th className="py-2 text-right">ELO</th>
                              </tr>
                            </thead>
                            <tbody>
                              {combinedLeaderboard.map((row, idx) => (
                                <tr
                                  key={row.accountKey || `${row.clubName}-${idx}`}
                                  className={`border-b border-slate-800 ${
                                    row.isYou ? 'bg-emerald-500/15 text-emerald-300 font-bold' : 'text-slate-200'
                                  }`}
                                >
                                  <td className="py-2.5 pr-2">{idx + 1}</td>
                                  <td className="py-2.5 pr-2">
                                    <span>{row.clubName}</span>
                                    {row.username && (
                                      <span className="ml-2 text-[10px] text-slate-400">
                                        {row.username === 'CPU' ? 'CPU' : `@${row.username}`}
                                      </span>
                                    )}
                                  </td>
                                  <td className="py-2.5 pr-2">{row.ovr || 75}</td>
                                  <td className="py-2.5 pr-2">
                                    {row.wins || 0}-{row.losses || 0}
                                  </td>
                                  <td className="py-2.5 text-right text-amber-300">{row.elo}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}
                </>
              )}
            </main>

            {/* MODALS: WALKOUT, PAUSE, MATCH RESULT, ACCOUNT, FIREBASE */}
            {walkoutResult && (
              <WalkoutModal packResult={walkoutResult} onClaim={handleClaimPack} />
            )}

            {showAccountModal && (
              <AccountModal
                currentUser={currentUser}
                currentClubName={save.clubName}
                fbConnected={fbConnected}
                onLogin={handleLoginAccount}
                onRegister={handleRegisterAccount}
                onLogout={handleLogoutAccount}
                onUpdateClubName={handleUpdateClubName}
                onClose={() => setShowAccountModal(false)}
              />
            )}

            {showStyleModal && (
              <StyleModal
                currentTheme={save.theme}
                currentFont={save.fontId}
                scanlines={save.scanlines}
                onUpdate={(patch) => setSave((p) => ({ ...p, ...patch }))}
                onClose={() => setShowStyleModal(false)}
              />
            )}

            {matchPaused && activeMatch && !matchResultModal && (
              <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="Match Paused">
                <div className={`pixel-panel w-full p-6 flex flex-col items-center gap-4 text-center max-h-[90vh] overflow-y-auto ${pauseTacticsOpen ? 'max-w-2xl' : 'max-w-sm'}`}>
                  <h2 className="font-arcade text-base text-amber-300">
                    {pauseTacticsOpen ? 'LIVE MATCH TACTICS' : 'MATCH PAUSED'}
                  </h2>
                  <p className="font-vt text-xl text-slate-300">
                    {activeMatch.homeName} vs {activeMatch.awayName}
                  </p>

                  {pauseTacticsOpen ? (
                    <div className="w-full text-left flex flex-col gap-4">
                      <TacticsEditorPanel
                        compact={true}
                        tactics={save.tactics}
                        onChange={(nextTactics) => setSave((p) => ({ ...p, tactics: nextTactics }))}
                      />
                      <button
                        type="button"
                        onClick={() => {
                          setPauseTacticsOpen(false);
                          setMatchPaused(false);
                        }}
                        className="w-full py-2.5 bg-emerald-500 text-slate-950 font-arcade text-xs pixel-btn"
                      >
                        APPLY TACTICS &amp; RESUME
                      </button>
                    </div>
                  ) : (
                    <div className="flex flex-col w-full gap-2.5">
                      <button
                        type="button"
                        onClick={() => setMatchPaused(false)}
                        className="w-full py-2.5 bg-emerald-500 text-slate-950 font-arcade text-xs pixel-btn"
                      >
                        RESUME MATCH
                      </button>
                      <button
                        type="button"
                        onClick={() => setPauseTacticsOpen(true)}
                        className="w-full py-2.5 bg-amber-400 text-slate-950 font-arcade text-xs pixel-btn"
                      >
                        ADJUST TEAM TACTICS
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setMatchPaused(false);
                          setActiveMatch((m) => ({ ...m, seed: m.seed + 1 }));
                        }}
                        className="w-full py-2.5 bg-slate-700 text-white font-pixel text-xs pixel-btn"
                      >
                        RESTART MATCH
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setMatchPaused(false);
                          setActiveMatch(null);
                        }}
                        className="w-full py-2.5 bg-rose-600 text-white font-pixel text-xs pixel-btn"
                      >
                        QUIT TO HUB
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {matchResultModal && (
              <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="Full Time Match Result">
                <div className="pixel-panel max-w-md w-full p-6 flex flex-col items-center gap-4 text-center">
                  <h2 className="font-arcade text-lg text-amber-300">
                    {matchResultModal.won ? 'VICTORY!' : matchResultModal.draw ? 'FULL TIME DRAW' : 'DEFEAT'}
                  </h2>
                  <div className="px-6 py-3 bg-slate-950 border-2 border-emerald-400 font-arcade text-2xl text-white tabular-nums">
                    {matchResultModal.homeScore} - {matchResultModal.awayScore}
                  </div>
                  <div className="w-full grid grid-cols-4 gap-2 text-xs tabular-nums">
                    <div className="p-2 bg-slate-950 border border-slate-700">
                      <div className="text-slate-400">COINS</div>
                      <div className="text-amber-300 font-bold mt-1">+{matchResultModal.coinsEarned}</div>
                    </div>
                    <div className="p-2 bg-slate-950 border border-slate-700">
                      <div className="text-slate-400">SHARDS</div>
                      <div className="text-sky-400 font-bold mt-1">+{matchResultModal.shardsEarned || 0}</div>
                    </div>
                    <div className="p-2 bg-slate-950 border border-slate-700">
                      <div className="text-slate-400">ELO</div>
                      <div className="text-emerald-400 font-bold mt-1">
                        {matchResultModal.eloDelta >= 0 ? `+${matchResultModal.eloDelta}` : matchResultModal.eloDelta}
                      </div>
                    </div>
                    <div className="p-2 bg-slate-950 border border-slate-700">
                      <div className="text-slate-400">POSS</div>
                      <div className="text-sky-400 font-bold mt-1">{matchResultModal.homePoss}%</div>
                    </div>
                  </div>
                  <div className="w-full text-[11px] text-slate-400 tabular-nums">
                    SHOTS {matchResultModal.homeShots}-{matchResultModal.awayShots} · PASSES {matchResultModal.homePasses || 0}-{matchResultModal.awayPasses || 0} · CROSSES {matchResultModal.homeCrosses || 0}-{matchResultModal.awayCrosses || 0} · DRIBBLES {matchResultModal.homeDribbles || 0}-{matchResultModal.awayDribbles || 0}
                  </div>
                  <div className="flex gap-3 w-full pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        setMatchResultModal(null);
                        setActiveMatch((m) => (m ? { ...m, seed: m.seed + 1 } : null));
                      }}
                      className="flex-1 py-2.5 bg-emerald-500 text-slate-950 font-arcade text-[10px] pixel-btn"
                    >
                      PLAY AGAIN
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setMatchResultModal(null);
                        setActiveMatch(null);
                      }}
                      className="flex-1 py-2.5 bg-slate-700 text-white font-arcade text-[10px] pixel-btn"
                    >
                      CLUBHOUSE
                    </button>
                  </div>
                </div>
              </div>
            )}

            {showFbModal && (
              <FirebaseConfigModal
                currentConfig={fbConfig}
                connected={fbConnected}
                fbError={fbError}
                onSave={(cfg) => {
                  localStorage.setItem(FB_STORAGE_KEY, JSON.stringify(cfg));
                  setFbConfig(cfg);
                  setShowFbModal(false);
                }}
                onUseOffline={() => {
                  localStorage.setItem(FB_STORAGE_KEY, JSON.stringify('OFFLINE'));
                  setFbConfig(null);
                  setShowFbModal(false);
                }}
                onClose={() => setShowFbModal(false)}
              />
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
    <script>
      (function () {
        var src = document.getElementById('pixel-kick-source').textContent;
        var compiled = window.Babel.transform(src, {
          presets: [['react', { runtime: 'classic' }]],
        }).code;
        var s = document.createElement('script');
        s.textContent = compiled;
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
