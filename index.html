        --header-bg: rgba(13, 27, 18, 0.96);

      html[data-theme='stadium-daylight'] {

        --bg-panel: #ffffff;
        --border-panel: #94a3b8;

        --text-muted: #475569;
        --emerald-pitch: #059669;
        --arcade-gold: #b45309;

      html[data-font='silkscreen'] {
        --font-ui: 'Silkscreen', monospace;
        --font-display: 'Press Start 2P', monospace;

      }
      html[data-font='vt323'] {
        --font-ui: 'VT323', monospace;
        --font-display: 'VT323', monospace;
        --font-vt-face: 'VT323', monospace;
      }
      html[data-font='chakra'] {
        --font-ui: 'Chakra Petch', sans-serif;
        --font-display: 'Chakra Petch', sans-serif;
        --font-vt-face: 'Chakra Petch', sans-serif;
      }
      html[data-font='space-mono'] {
        --font-ui: 'Space Mono', monospace;
        --font-display: 'Space Mono', monospace;
        --font-vt-face: 'Space Mono', monospace;
      }
      html[data-font='outfit'] {
        --font-ui: 'Outfit', sans-serif;
        --font-display: 'Outfit', sans-serif;
        --font-vt-face: 'Outfit', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-obsidian);
        color: var(--text-main);
        font-family: var(--font-ui);
        overflow-x: hidden;
      }

      .font-arcade {
        font-family: var(--font-display);
      }

      .font-pixel {
        font-family: var(--font-ui);
      }

      .font-vt {
        font-family: var(--font-vt-face);
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Chromatic Aberration Retro Header */
      .crt-aberration {
        text-shadow: -1.5px 0 rgba(255, 30, 86, 0.55), 1.5px 0 rgba(0, 229, 255, 0.55);
      }

      /* CRT Scanline & Vignette Overlay */
      .crt-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        background:
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.24) 50%),
          radial-gradient(circle at center, transparent 62%, rgba(0, 0, 0, 0.55) 100%);
        background-size: 100% 4px, 100% 100%;
      }

      .crt-edge-chroma {
        box-shadow:
          inset 2px 0 6px rgba(255, 0, 75, 0.08),
          inset -2px 0 6px rgba(0, 230, 255, 0.08);
      }

      /* Pixel Beveled 8-bit Buttons */
      .pixel-btn {
        position: relative;
        border: 2px solid #000;
        box-shadow:
          inset 2px 2px 0 rgba(255, 255, 255, 0.25),
          inset -2px -2px 0 rgba(0, 0, 0, 0.45),
          0 4px 0 #05080e;
        transition: transform 80ms ease, box-shadow 80ms ease, filter 120ms ease;
      }

      .pixel-btn:hover:not(:disabled) {
        filter: brightness(1.08);
      }

      .pixel-btn:active:not(:disabled) {
        transform: translateY(3px);
        box-shadow:
          inset 2px 2px 0 rgba(255, 255, 255, 0.2),
          inset -2px -2px 0 rgba(0, 0, 0, 0.45),
          0 1px 0 #05080e;
      }

      .pixel-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .pixel-panel {
        background: var(--bg-panel);
        border: 2px solid var(--border-panel);
        box-shadow:
          inset 2px 2px 0 rgba(255, 255, 255, 0.06),
          inset -2px -2px 0 rgba(0, 0, 0, 0.35),
          0 6px 0 rgba(0, 0, 0, 0.25);
      }

      .theme-header {
        background: var(--header-bg);
        border-color: var(--border-panel);
      }

      html[data-theme='stadium-daylight'] .pixel-panel {
        color: #0f172a;
      }
      html[data-theme='stadium-daylight'] .pixel-panel .text-white {
        color: #0f172a;
      }
      html[data-theme='stadium-daylight'] .pixel-panel .text-slate-200,
      html[data-theme='stadium-daylight'] .pixel-panel .text-slate-300,
      html[data-theme='stadium-daylight'] main .text-slate-300 {
        color: #334155;
      }
      html[data-theme='stadium-daylight'] .pixel-panel .text-slate-400,
      html[data-theme='stadium-daylight'] main .text-slate-400 {
        color: #475569;
      }
      html[data-theme='stadium-daylight'] .pixel-panel .bg-slate-950,
      html[data-theme='stadium-daylight'] .pixel-panel .bg-slate-900 {
        background-color: #f1f5f9;
        color: #0f172a;
      }
      html[data-theme='stadium-daylight'] .pixel-panel .text-amber-300,
      html[data-theme='stadium-daylight'] main .text-amber-300 {
        color: #b45309;
      }
      html[data-theme='stadium-daylight'] .pixel-panel .text-emerald-400,
      html[data-theme='stadium-daylight'] .pixel-panel .text-emerald-300,
      html[data-theme='stadium-daylight'] main .text-emerald-400 {
        color: #047857;
      }
      html[data-theme='stadium-daylight'] .pixel-panel .text-sky-400,
      html[data-theme='stadium-daylight'] main .text-sky-400 {
        color: #0369a1;
      }
      html[data-theme='stadium-daylight'] .theme-header .font-arcade.text-white,
      html[data-theme='stadium-daylight'] .theme-header h1.text-white {
        color: #0f172a;
      }
      html[data-theme='stadium-daylight'] .theme-header .text-emerald-400 {
        color: #047857;
      }
      html[data-theme='stadium-daylight'] .theme-header .text-slate-400 {
        color: #475569;
      }
      html[data-theme='stadium-daylight'] .pixel-panel input,
      html[data-theme='stadium-daylight'] .pixel-panel select,
      html[data-theme='stadium-daylight'] .pixel-panel textarea {
        background-color: #ffffff;
        color: #0f172a;
        border-color: #94a3b8;
      }
      html[data-theme='stadium-daylight'] main .pixel-btn.bg-slate-800,
      html[data-theme='stadium-daylight'] .pixel-panel .pixel-btn.bg-slate-800,
      html[data-theme='stadium-daylight'] .theme-header .pixel-btn.bg-slate-800 {
        background-color: #e2e8f0;
        color: #0f172a;
      }
      html[data-theme='stadium-daylight'] main .pixel-btn.bg-slate-700,
      html[data-theme='stadium-daylight'] .pixel-panel .pixel-btn.bg-slate-700 {
        background-color: #cbd5e1;
        color: #0f172a;
      }
      html[data-theme='stadium-daylight'] .crt-overlay {
        opacity: 0.22;
      }

      /* 8 Distinct Card Rarity Tier Styles */
      .tier-bronze {
        background: linear-gradient(145deg, #6e3b1c 0%, #9b5528 45%, #512912 100%);
        border: 3px solid #cd7f32;
        box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.55), 0 0 12px rgba(205, 127, 50, 0.25);
      }

      .tier-silver {
        background: linear-gradient(135deg, #475569 0%, #cbd5e1 45%, #64748b 70%, #334155 100%);
        border: 3px solid #e2e8f0;
        box-shadow: inset 0 0 14px rgba(15, 23, 42, 0.45), 0 0 12px rgba(226, 232, 240, 0.25);
        color: #0f172a;
      }

      .tier-gold {
        background: linear-gradient(135deg, #92400e 0%, #facc15 45%, #ca8a04 75%, #78350f 100%);
        border: 3px solid #fde047;
        box-shadow: inset 0 0 16px rgba(120, 53, 15, 0.45), 0 0 16px rgba(250, 204, 21, 0.35);
        color: #1c1917;
      }

      @keyframes elitePulse {
        0%, 100% {
          box-shadow: 0 0 14px rgba(250, 204, 21, 0.65), inset 0 0 16px rgba(254, 240, 138, 0.35);
          border-color: #fef08a;
        }
        50% {
          box-shadow: 0 0 26px rgba(250, 204, 21, 0.95), inset 0 0 22px rgba(255, 255, 255, 0.45);
          border-color: #ffffff;
        }
      }

      .tier-elite {
        background: linear-gradient(135deg, #ca8a04 0%, #fef08a 35%, #eab308 65%, #854d0e 100%);
        border: 3px solid #fef08a;
        color: #111827;
        animation: elitePulse 2.1s infinite ease-in-out;
      }

      .tier-totw {
        background:
          repeating-linear-gradient(
            -35deg,
            rgba(255, 214, 0, 0.14) 0px,
            rgba(255, 214, 0, 0.14) 2px,
            transparent 2px,
            transparent 16px
          ),
          linear-gradient(155deg, #090b10 0%, #171a24 55%, #050608 100%);
        border: 3px solid #ffd600;
        box-shadow: 0 0 18px rgba(255, 214, 0, 0.45), inset 0 0 18px rgba(255, 214, 0, 0.15);
      }

      .tier-hero {
        background:
          radial-gradient(rgba(255, 255, 255, 0.16) 1.5px, transparent 1.5px),
          linear-gradient(145deg, #3b0764 0%, #9d174d 55%, #4c0519 100%);
        background-size: 8px 8px, 100% 100%;
        border: 3px solid #fbbf24;
        box-shadow: 0 0 20px rgba(244, 63, 94, 0.45), inset 0 0 18px rgba(251, 191, 36, 0.25);
      }

      @keyframes iconShimmer {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .tier-icon {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 30%, #ffffff 50%, #cbd5e1 75%, #f8fafc 100%);
        background-size: 200% 200%;
        animation: iconShimmer 4s ease infinite;
        border: 3px solid #d4af37;
        box-shadow: 0 0 24px rgba(255, 255, 255, 0.55), inset 0 0 16px rgba(212, 175, 55, 0.35);
        color: #0f172a;
      }

      @keyframes ssGlitch {
        0%, 88%, 100% {
          filter: hue-rotate(0deg);
          transform: translate(0, 0);
        }
        90% {
          filter: hue-rotate(25deg) contrast(1.15);
          transform: translate(-1px, 0);
        }
        93% {
          filter: hue-rotate(-20deg) brightness(1.15);
          transform: translate(1px, -1px);
        }
        96% {
          transform: translate(0, 1px);
        }
      }

      .tier-shapeshifter {
        background:
          repeating-linear-gradient(
            90deg,
            rgba(0, 255, 102, 0.08) 0px,
            rgba(0, 255, 102, 0.08) 2px,
            transparent 2px,
            transparent 10px
          ),
          linear-gradient(145deg, #022c22 0%, #064e3b 48%, #021814 100%);
        border: 3px solid #00ff66;
        box-shadow: 0 0 22px rgba(0, 255, 102, 0.5), inset 0 0 20px rgba(0, 255, 102, 0.25);
        animation: ssGlitch 3.2s infinite;
      }

      /* Mouse/Gyro Reactive Holographic Sheen */
      .holo-sheen {
        position: relative;
        overflow: hidden;
      }

      .holo-sheen::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at var(--mx, 50%) var(--my, 50%),
          rgba(255, 255, 255, 0.36) 0%,
          rgba(0, 255, 180, 0.14) 24%,
          rgba(255, 0, 140, 0.1) 42%,
          transparent 68%
        );
        mix-blend-mode: overlay;
        opacity: 0.85;
        transition: opacity 150ms ease;
      }

      /* Pack Shake & Walkout Slam Animations */
      @keyframes packShake {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        15% { transform: translate(-6px, -4px) rotate(-3deg); }
        30% { transform: translate(7px, 3px) rotate(3deg); }
        45% { transform: translate(-8px, 4px) rotate(-4deg); }
        60% { transform: translate(8px, -4px) rotate(4deg); }
        75% { transform: translate(-6px, 2px) rotate(-2deg); }
        90% { transform: translate(5px, -2px) rotate(2deg); }
      }

      .animate-pack-shake {
        animation: packShake 0.38s infinite linear;
      }

      @keyframes cardSlam {
        0% { transform: scale(2.2) translateY(-40px); opacity: 0; }
        70% { transform: scale(0.95) translateY(4px); opacity: 1; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
      }

      .animate-card-slam {
        animation: cardSlam 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes screenShake {
        0%, 100% { transform: translate(0, 0); }
        20% { transform: translate(-8px, 6px); }
        40% { transform: translate(8px, -6px); }
        60% { transform: translate(-5px, -4px); }
        80% { transform: translate(5px, 4px); }
      }

      .animate-screen-shake {
        animation: screenShake 0.35s ease-out;
      }

      @keyframes confettiFall {
        0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
        100% { transform: translateY(520px) rotate(540deg); opacity: 0; }
      }

      .confetti-bit {
        position: absolute;
        width: 10px;
        height: 10px;
        animation: confettiFall 2.2s linear forwards;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0b111c;
      }
      ::-webkit-scrollbar-thumb {
        background: #2b3c58;
        border: 1px solid #0b111c;
      }

      @media (prefers-reduced-motion: reduce) {
        .tier-elite,
        .tier-icon,
        .tier-shapeshifter,
        .animate-pack-shake,
        .animate-card-slam,
        .animate-screen-shake {
          animation: none !important;
        }
      }
    </style>
  </head>

    <script id="pixel-kick-source" type="text/plain">
      const { useState, useEffect, useRef, useMemo, useCallback } = React;

      /* =========================================================================
         1. WEB AUDIO API 8-BIT SYNTH SOUNDSCAPE (ZERO EXTERNAL AUDIO FILES)
      ========================================================================= */
      class RetroAudioEngine {
        constructor() {
          this.ctx = null;
          this.muted = false;
        }

        ensureCtx() {
          if (this.muted) return null;
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (!AudioCtx) return null;
              this.ctx = new AudioCtx();
            }
            if (this.ctx.state === 'suspended') {
              this.ctx.resume().catch(() => {});
            }
            return this.ctx;
          } catch {
            return null;
          }
        }

        playClick() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(860, now + 0.045);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.06);
        }

        playPackShake() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          for (let i = 0; i < 6; i++) {
            const t = now + i * 0.14;
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160 + i * 45, t);
            g.gain.setValueAtTime(0.08, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.1);
          }
        }

        playPackTear() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const bufferSize = ctx.sampleRate * 0.25;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
          }
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1600, now);
          filter.frequency.exponentialRampToValueAtTime(420, now + 0.24);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.22, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          src.connect(filter);
          filter.connect(g);
          g.connect(ctx.destination);
          src.start(now);
        }

        playWalkoutStep(step) {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const freqs = [220, 277.18, 329.63, 440];
          const base = freqs[Math.min(3, step)];
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(base, now);
          osc.frequency.exponentialRampToValueAtTime(base * 1.5, now + 0.16);
          g.gain.setValueAtTime(0.11, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.26);

          if (step === 3) {
            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((n, idx) => {
              const t = now + 0.12 + idx * 0.09;
              const o = ctx.createOscillator();
              const gg = ctx.createGain();
              o.type = 'square';
              o.frequency.setValueAtTime(n, t);
              gg.gain.setValueAtTime(0.09, t);
              gg.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
              o.connect(gg);
              gg.connect(ctx.destination);
              o.start(t);
              o.stop(t + 0.28);
            });
          }
        }

        playKick(power = 1) {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(160 * Math.min(1.4, power), now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.08);
          g.gain.setValueAtTime(0.14, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.095);
        }

        playWhistle(kind = 'short') {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const blasts = kind === 'fulltime' ? [0, 0.22, 0.44] : [0];
          blasts.forEach((offset, idx) => {
            const dur = kind === 'fulltime' && idx === 2 ? 0.35 : 0.14;
            const osc = ctx.createOscillator();
            const lfo = ctx.createOscillator();
            const lfoGain = ctx.createGain();
            const g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(2850, now + offset);
            lfo.frequency.setValueAtTime(36, now + offset);
            lfoGain.gain.setValueAtTime(120, now + offset);
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);
            g.gain.setValueAtTime(0.06, now + offset);
            g.gain.exponentialRampToValueAtTime(0.001, now + offset + dur);
            osc.connect(g);
            g.connect(ctx.destination);
            lfo.start(now + offset);
            osc.start(now + offset);
            lfo.stop(now + offset + dur + 0.02);
            osc.stop(now + offset + dur + 0.02);
          });
        }

        playPostClang() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(980, now);
          osc.frequency.exponentialRampToValueAtTime(720, now + 0.35);
          g.gain.setValueAtTime(0.14, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        }

        playGoalRoar() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const bufferSize = ctx.sampleRate * 0.9;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            const env = Math.sin((i / bufferSize) * Math.PI);
            data[i] = (Math.random() * 2 - 1) * env;
          }
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1100, now);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.16, now);
          g.gain.exponentialRampToValueAtTime(0.002, now + 0.9);
          src.connect(filter);
          filter.connect(g);
          g.connect(ctx.destination);
          src.start(now);

          [261.63, 329.63, 392.0, 523.25].forEach((freq, idx) => {
            const o = ctx.createOscillator();
            const gg = ctx.createGain();
            o.type = 'sawtooth';

      const DRAFT_MANAGERS = [

      /* =========================================================================
         3. PURE GAME MATH & DETERMINISTIC ENGINE
      ========================================================================= */
      function createSeededRng(seed) {
        let t = seed >>> 0;
        return () => {
          t += 0x6d2b79f5;
          let r = Math.imul(t ^ (t >>> 15), 1 | t);
          r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }

      function getPositionGroup(pos) {
        if (pos === 'GK') return 'GK';
        if (pos === 'LB' || pos === 'CB' || pos === 'RB') return 'DEF';
        if (pos === 'LW' || pos === 'RW' || pos === 'ST') return 'FWD';
        return 'MID';
      }

      function calculateSquadChemistry(squad, formation) {
        const slots = FORMATIONS[formation] || FORMATIONS['4-3-3'];
        const playerChems = new Array(11).fill(0);
        const oopPenalties = new Array(11).fill(false);

        const nationCounts = {};
        const clubCounts = {};
        const leagueCounts = {};
        let iconCount = 0;
        let shapeshifterCount = 0;

        for (let i = 0; i < 11; i++) {
          const card = squad[i];
          const slot = slots[i];
          if (!card) continue;
          const exactMatch = card.pos === slot.pos || card.tier === 'shapeshifter';
          const groupMatch = getPositionGroup(card.pos) === slot.role;
          if (!exactMatch && !groupMatch) {
            oopPenalties[i] = true;
          }
          if (card.tier === 'icon') iconCount += 1;
          if (card.tier === 'shapeshifter') shapeshifterCount += 1;
          nationCounts[card.nation] = (nationCounts[card.nation] || 0) + 1;
          const cw = card.tier === 'hero' ? 2 : 1;
          clubCounts[card.club] = (clubCounts[card.club] || 0) + cw;
          leagueCounts[card.league] = (leagueCounts[card.league] || 0) + cw;
        }

        let ratingSum = 0;
        let count = 0;

        for (let i = 0; i < 11; i++) {
          const card = squad[i];
          if (!card) continue;
          count += 1;
          ratingSum += oopPenalties[i] ? Math.max(40, card.ovr - 6) : card.ovr;
          if (oopPenalties[i]) {
            playerChems[i] = 0;
            continue;
          }
          if (card.tier === 'icon' || card.tier === 'hero' || card.tier === 'shapeshifter') {
            playerChems[i] = 3;
            continue;
          }
          let pts = 0;
          const nCount = (nationCounts[card.nation] || 0) + iconCount;
          const cCount = (clubCounts[card.club] || 0) + shapeshifterCount;
          const lCount = (leagueCounts[card.league] || 0) + iconCount + shapeshifterCount;
          if (nCount >= 5) pts += 2;
          else if (nCount >= 2) pts += 1;
          if (cCount >= 4) pts += 2;
          else if (cCount >= 2) pts += 1;
          if (lCount >= 5) pts += 2;
          else if (lCount >= 3) pts += 1;
          playerChems[i] = Math.min(3, pts);
        }

        return {
          totalChem: playerChems.reduce((a, b) => a + b, 0),
          playerChems,
          oopPenalties,
          avgRating: count > 0 ? Math.round(ratingSum / count) : 0,
        };
      }

      function evaluateSBC(criteria, cards) {
        const reasons = [];
        if (cards.length < criteria.requiredCount) {
          reasons.push(`Need ${criteria.requiredCount} players (${cards.length}/${criteria.requiredCount})`);
        }
        const avgOvr = cards.length > 0 ? Math.round(cards.reduce((s, c) => s + c.ovr, 0) / cards.length) : 0;
        if (avgOvr < criteria.minAvgOvr) {
          reasons.push(`Avg Rating ${avgOvr} < ${criteria.minAvgOvr}`);
        }
        if (criteria.minShapeshifters) {
          const ss = cards.filter((c) => c.tier === 'shapeshifter').length;
          if (ss < criteria.minShapeshifters) reasons.push(`Shapeshifters ${ss}/${criteria.minShapeshifters}`);
        }
        if (criteria.minTotwOrSpecial) {
          const sp = cards.filter((c) => ['totw', 'hero', 'icon', 'shapeshifter'].includes(c.tier)).length;
          if (sp < criteria.minTotwOrSpecial) reasons.push(`Special Cards ${sp}/${criteria.minTotwOrSpecial}`);
        }
        if (criteria.minNations) {
          const n = new Set(cards.map((c) => c.nation)).size;
          if (n < criteria.minNations) reasons.push(`Nations ${n}/${criteria.minNations}`);
        }
        return { valid: reasons.length === 0, reasons, avgOvr };
      }

      function getDivisionFromElo(elo) {
        if (elo >= 1900) return 1;
        if (elo >= 1750) return 2;
        if (elo >= 1600) return 3;
        if (elo >= 1450) return 4;
        if (elo >= 1320) return 5;
        if (elo >= 1200) return 6;
        if (elo >= 1100) return 7;
        if (elo >= 1000) return 8;
        if (elo >= 900) return 9;
        return 10;
      }

      function pickOvrWeightedCard(source, rng) {
        if (source.length === 1) return source[0];
        let totalW = 0;
        const wList = source.map((c) => {
          const baseDecay = Math.pow(0.62, Math.max(0, c.ovr - 78));
          const ninetyGate = c.ovr >= 90 ? 0.14 : 1;
          const w = Math.max(0.002, baseDecay * ninetyGate);
          totalW += w;
          return w;
        });
        let r = rng() * totalW;
        for (let i = 0; i < source.length; i++) {
          r -= wList[i];
          if (r <= 0) return source[i];
        }
        return source[source.length - 1];
      }

      function rollPackCards(packType, rng) {
        const weights = {
          bronze: { bronze: 78, silver: 20, gold: 2, elite: 0, totw: 0, hero: 0, icon: 0, shapeshifter: 0 },
          gold: { bronze: 0, silver: 40, gold: 56, elite: 3.4, totw: 0.5, hero: 0.08, icon: 0.01, shapeshifter: 0.01 },
          elite: { bronze: 0, silver: 15, gold: 64, elite: 17, totw: 3, hero: 0.8, icon: 0.1, shapeshifter: 0.1 },
          shapeshifter: { bronze: 0, silver: 0, gold: 45, elite: 38, totw: 11, hero: 4, icon: 0.2, shapeshifter: 1.8 },
          icon: { bronze: 0, silver: 0, gold: 34, elite: 42, totw: 14, hero: 6, icon: 2.5, shapeshifter: 1.5 },
        };
        const leadWeights = {
          elite: { bronze: 0, silver: 0, gold: 0, elite: 75, totw: 18, hero: 5.5, icon: 0.75, shapeshifter: 0.75 },
          shapeshifter: { bronze: 0, silver: 0, gold: 0, elite: 50, totw: 28, hero: 12, icon: 1, shapeshifter: 9 },
          icon: { bronze: 0, silver: 0, gold: 0, elite: 40, totw: 28, hero: 16, icon: 11, shapeshifter: 5 },
        };

        const pickFromTable = (table) => {
          const tiers = Object.keys(table);
          const total = tiers.reduce((acc, t) => acc + table[t], 0);
          let r = rng() * total;
          for (const t of tiers) {
            r -= table[t];
            if (r <= 0) return t;
          }
          return 'gold';
        };

        const cards = [];
        for (let i = 0; i < 3; i++) {
          const table = i === 0 && leadWeights[packType] ? leadWeights[packType] : (weights[packType] || weights.gold);
          const tier = pickFromTable(table);
          const matching = PLAYER_POOL.filter((p) => p.tier === tier);
          const src = matching.length > 0 ? matching : PLAYER_POOL;
          cards.push(pickOvrWeightedCard(src, rng));
        }
        cards.sort((a, b) => b.ovr - a.ovr);
        const bestCard = cards[0];
        const isSpecial = ['totw', 'hero', 'icon', 'shapeshifter'].includes(bestCard.tier);
        const isWalkout = bestCard.ovr >= 85 || isSpecial;
        return { cards, bestCard, isWalkout };
      }

              setStage(2);

              audioFX.playWalkoutStep(1);
