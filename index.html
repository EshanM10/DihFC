    <style>
      :root {
        --bg-obsidian: #070b12;
        --bg-cabinet: #111927;
        --bg-panel: #172235;
        --emerald-pitch: #00e676;
        --arcade-gold: #ffd600;
        --mx: 50%;
        --my: 50%;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-obsidian);
        color: #f1f5f9;
        font-family: 'Silkscreen', monospace;
        overflow-x: hidden;
      }

      .font-arcade {
        font-family: 'Press Start 2P', monospace;
      }

      .font-pixel {
        font-family: 'Silkscreen', monospace;
      }

      .font-vt {
        font-family: 'VT323', monospace;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Chromatic Aberration Retro Header */
      .crt-aberration {
        text-shadow: -1.5px 0 rgba(255, 30, 86, 0.55), 1.5px 0 rgba(0, 229, 255, 0.55);
      }

      /* CRT Scanline & Vignette Overlay */
      .crt-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        background:
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.24) 50%),
          radial-gradient(circle at center, transparent 62%, rgba(0, 0, 0, 0.55) 100%);
        background-size: 100% 4px, 100% 100%;
      }

      .crt-edge-chroma {
        box-shadow:
          inset 2px 0 6px rgba(255, 0, 75, 0.08),
          inset -2px 0 6px rgba(0, 230, 255, 0.08);
      }

      /* Pixel Beveled 8-bit Buttons */
      .pixel-btn {
        position: relative;
        border: 2px solid #000;
        box-shadow:
          inset 2px 2px 0 rgba(255, 255, 255, 0.25),
          inset -2px -2px 0 rgba(0, 0, 0, 0.45),
          0 4px 0 #05080e;
        transition: transform 80ms ease, box-shadow 80ms ease, filter 120ms ease;
      }

      .pixel-btn:hover:not(:disabled) {
        filter: brightness(1.08);
      }

      .pixel-btn:active:not(:disabled) {
        transform: translateY(3px);
        box-shadow:
          inset 2px 2px 0 rgba(255, 255, 255, 0.2),
          inset -2px -2px 0 rgba(0, 0, 0, 0.45),
          0 1px 0 #05080e;
      }

      .pixel-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .pixel-panel {
        background: #101827;
        border: 2px solid #283852;
        box-shadow:
          inset 2px 2px 0 rgba(255, 255, 255, 0.06),
          inset -2px -2px 0 rgba(0, 0, 0, 0.55),
          0 6px 0 rgba(0, 0, 0, 0.45);
      }

      /* 8 Distinct Card Rarity Tier Styles */
      .tier-bronze {
        background: linear-gradient(145deg, #6e3b1c 0%, #9b5528 45%, #512912 100%);
        border: 3px solid #cd7f32;
        box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.55), 0 0 12px rgba(205, 127, 50, 0.25);
      }

      .tier-silver {
        background: linear-gradient(135deg, #475569 0%, #cbd5e1 45%, #64748b 70%, #334155 100%);
        border: 3px solid #e2e8f0;
        box-shadow: inset 0 0 14px rgba(15, 23, 42, 0.45), 0 0 12px rgba(226, 232, 240, 0.25);
        color: #0f172a;
      }

      .tier-gold {
        background: linear-gradient(135deg, #92400e 0%, #facc15 45%, #ca8a04 75%, #78350f 100%);
        border: 3px solid #fde047;
        box-shadow: inset 0 0 16px rgba(120, 53, 15, 0.45), 0 0 16px rgba(250, 204, 21, 0.35);
        color: #1c1917;
      }

      @keyframes elitePulse {
        0%, 100% {
          box-shadow: 0 0 14px rgba(250, 204, 21, 0.65), inset 0 0 16px rgba(254, 240, 138, 0.35);
          border-color: #fef08a;
        }
        50% {
          box-shadow: 0 0 26px rgba(250, 204, 21, 0.95), inset 0 0 22px rgba(255, 255, 255, 0.45);
          border-color: #ffffff;
        }
      }

      .tier-elite {
        background: linear-gradient(135deg, #ca8a04 0%, #fef08a 35%, #eab308 65%, #854d0e 100%);
        border: 3px solid #fef08a;
        color: #111827;
        animation: elitePulse 2.1s infinite ease-in-out;
      }

      .tier-totw {
        background:
          repeating-linear-gradient(
            -35deg,
            rgba(255, 214, 0, 0.14) 0px,
            rgba(255, 214, 0, 0.14) 2px,
            transparent 2px,
            transparent 16px
          ),
          linear-gradient(155deg, #090b10 0%, #171a24 55%, #050608 100%);
        border: 3px solid #ffd600;
        box-shadow: 0 0 18px rgba(255, 214, 0, 0.45), inset 0 0 18px rgba(255, 214, 0, 0.15);
      }

      .tier-hero {
        background:
          radial-gradient(rgba(255, 255, 255, 0.16) 1.5px, transparent 1.5px),
          linear-gradient(145deg, #3b0764 0%, #9d174d 55%, #4c0519 100%);
        background-size: 8px 8px, 100% 100%;
        border: 3px solid #fbbf24;
        box-shadow: 0 0 20px rgba(244, 63, 94, 0.45), inset 0 0 18px rgba(251, 191, 36, 0.25);
      }

      @keyframes iconShimmer {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .tier-icon {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 30%, #ffffff 50%, #cbd5e1 75%, #f8fafc 100%);
        background-size: 200% 200%;
        animation: iconShimmer 4s ease infinite;
        border: 3px solid #d4af37;
        box-shadow: 0 0 24px rgba(255, 255, 255, 0.55), inset 0 0 16px rgba(212, 175, 55, 0.35);
        color: #0f172a;
      }

      @keyframes ssGlitch {
        0%, 88%, 100% {
          filter: hue-rotate(0deg);
          transform: translate(0, 0);
        }
        90% {
          filter: hue-rotate(25deg) contrast(1.15);
          transform: translate(-1px, 0);
        }
        93% {
          filter: hue-rotate(-20deg) brightness(1.15);
          transform: translate(1px, -1px);
        }
        96% {
          transform: translate(0, 1px);
        }
      }

      .tier-shapeshifter {
        background:
          repeating-linear-gradient(
            90deg,
            rgba(0, 255, 102, 0.08) 0px,
            rgba(0, 255, 102, 0.08) 2px,
            transparent 2px,
            transparent 10px
          ),
          linear-gradient(145deg, #022c22 0%, #064e3b 48%, #021814 100%);
        border: 3px solid #00ff66;
        box-shadow: 0 0 22px rgba(0, 255, 102, 0.5), inset 0 0 20px rgba(0, 255, 102, 0.25);
        animation: ssGlitch 3.2s infinite;
      }

      /* Mouse/Gyro Reactive Holographic Sheen */
      .holo-sheen {
        position: relative;
        overflow: hidden;
      }

      .holo-sheen::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at var(--mx, 50%) var(--my, 50%),
          rgba(255, 255, 255, 0.36) 0%,
          rgba(0, 255, 180, 0.14) 24%,
          rgba(255, 0, 140, 0.1) 42%,
          transparent 68%
        );
        mix-blend-mode: overlay;
        opacity: 0.85;
        transition: opacity 150ms ease;
      }

      /* Pack Shake & Walkout Slam Animations */
      @keyframes packShake {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        15% { transform: translate(-6px, -4px) rotate(-3deg); }
        30% { transform: translate(7px, 3px) rotate(3deg); }
        45% { transform: translate(-8px, 4px) rotate(-4deg); }
        60% { transform: translate(8px, -4px) rotate(4deg); }
        75% { transform: translate(-6px, 2px) rotate(-2deg); }
        90% { transform: translate(5px, -2px) rotate(2deg); }
      }

      .animate-pack-shake {
        animation: packShake 0.38s infinite linear;
      }

      @keyframes cardSlam {
        0% { transform: scale(2.2) translateY(-40px); opacity: 0; }
        70% { transform: scale(0.95) translateY(4px); opacity: 1; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
      }

      .animate-card-slam {
        animation: cardSlam 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes screenShake {
        0%, 100% { transform: translate(0, 0); }
        20% { transform: translate(-8px, 6px); }
        40% { transform: translate(8px, -6px); }
        60% { transform: translate(-5px, -4px); }
        80% { transform: translate(5px, 4px); }
      }

      .animate-screen-shake {
        animation: screenShake 0.35s ease-out;
      }

      @keyframes confettiFall {
        0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
        100% { transform: translateY(520px) rotate(540deg); opacity: 0; }
      }

      .confetti-bit {
        position: absolute;
        width: 10px;
        height: 10px;
        animation: confettiFall 2.2s linear forwards;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0b111c;
      }
      ::-webkit-scrollbar-thumb {
        background: #2b3c58;
        border: 1px solid #0b111c;
      }

      @media (prefers-reduced-motion: reduce) {
        .tier-elite,
        .tier-icon,
        .tier-shapeshifter,
        .animate-pack-shake,
        .animate-card-slam,
        .animate-screen-shake {
          animation: none !important;
        }
      }
    </style>
  </head>

      const { useState, useEffect, useRef, useMemo, useCallback } = React;

      /* =========================================================================
         1. WEB AUDIO API 8-BIT SYNTH SOUNDSCAPE (ZERO EXTERNAL AUDIO FILES)
      ========================================================================= */
      class RetroAudioEngine {
        constructor() {
          this.ctx = null;
          this.muted = false;
        }

        ensureCtx() {
          if (this.muted) return null;
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (!AudioCtx) return null;
              this.ctx = new AudioCtx();
            }
            if (this.ctx.state === 'suspended') {
              this.ctx.resume().catch(() => {});
            }
            return this.ctx;
          } catch {
            return null;
          }
        }

        playClick() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(860, now + 0.045);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.06);
        }

        playPackShake() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          for (let i = 0; i < 6; i++) {
            const t = now + i * 0.14;
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160 + i * 45, t);
            g.gain.setValueAtTime(0.08, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.1);
          }
        }

        playPackTear() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const bufferSize = ctx.sampleRate * 0.25;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
          }
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1600, now);
          filter.frequency.exponentialRampToValueAtTime(420, now + 0.24);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.22, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          src.connect(filter);
          filter.connect(g);
          g.connect(ctx.destination);
          src.start(now);
        }

        playWalkoutStep(step) {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const freqs = [220, 277.18, 329.63, 440];
          const base = freqs[Math.min(3, step)];
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(base, now);
          osc.frequency.exponentialRampToValueAtTime(base * 1.5, now + 0.16);
          g.gain.setValueAtTime(0.11, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.26);

          if (step === 3) {
            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((n, idx) => {
              const t = now + 0.12 + idx * 0.09;
              const o = ctx.createOscillator();
              const gg = ctx.createGain();
              o.type = 'square';
              o.frequency.setValueAtTime(n, t);
              gg.gain.setValueAtTime(0.09, t);
              gg.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
              o.connect(gg);
              gg.connect(ctx.destination);
              o.start(t);
              o.stop(t + 0.28);
            });
          }
        }

        playKick(power = 1) {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(160 * Math.min(1.4, power), now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.08);
          g.gain.setValueAtTime(0.14, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.095);
        }

        playWhistle(kind = 'short') {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const blasts = kind === 'fulltime' ? [0, 0.22, 0.44] : [0];
          blasts.forEach((offset, idx) => {
            const dur = kind === 'fulltime' && idx === 2 ? 0.35 : 0.14;
            const osc = ctx.createOscillator();
            const lfo = ctx.createOscillator();
            const lfoGain = ctx.createGain();
            const g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(2850, now + offset);
            lfo.frequency.setValueAtTime(36, now + offset);
            lfoGain.gain.setValueAtTime(120, now + offset);
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);
            g.gain.setValueAtTime(0.06, now + offset);
            g.gain.exponentialRampToValueAtTime(0.001, now + offset + dur);
            osc.connect(g);
            g.connect(ctx.destination);
            lfo.start(now + offset);
            osc.start(now + offset);
            lfo.stop(now + offset + dur + 0.02);
            osc.stop(now + offset + dur + 0.02);
          });
        }

        playPostClang() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(980, now);
          osc.frequency.exponentialRampToValueAtTime(720, now + 0.35);
          g.gain.setValueAtTime(0.14, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        }

        playGoalRoar() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const bufferSize = ctx.sampleRate * 0.9;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            const env = Math.sin((i / bufferSize) * Math.PI);
            data[i] = (Math.random() * 2 - 1) * env;
          }
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1100, now);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.16, now);
          g.gain.exponentialRampToValueAtTime(0.002, now + 0.9);
          src.connect(filter);
          filter.connect(g);
          g.connect(ctx.destination);
          src.start(now);

          [261.63, 329.63, 392.0, 523.25].forEach((freq, idx) => {
            const o = ctx.createOscillator();
            const gg = ctx.createGain();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(freq, now + idx * 0.05);
            gg.gain.setValueAtTime(0.055, now + idx * 0.05);
            gg.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
            o.connect(gg);
            gg.connect(ctx.destination);
            o.start(now + idx * 0.05);
            o.stop(now + 0.6);
          });
        }

        playCardBook() {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(185, now);
          g.gain.setValueAtTime(0.1, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
        }
      }

      /* =========================================================================
         3. PURE GAME MATH & DETERMINISTIC ENGINE
      ========================================================================= */
      function createSeededRng(seed) {
        let t = seed >>> 0;
        return () => {
          t += 0x6d2b79f5;
          let r = Math.imul(t ^ (t >>> 15), 1 | t);
          r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }

      function getPositionGroup(pos) {
        if (pos === 'GK') return 'GK';
        if (pos === 'LB' || pos === 'CB' || pos === 'RB') return 'DEF';
        if (pos === 'LW' || pos === 'RW' || pos === 'ST') return 'FWD';
        return 'MID';
      }

      function calculateSquadChemistry(squad, formation) {
        const slots = FORMATIONS[formation] || FORMATIONS['4-3-3'];
        const playerChems = new Array(11).fill(0);
        const oopPenalties = new Array(11).fill(false);

        const nationCounts = {};
        const clubCounts = {};
        const leagueCounts = {};
        let iconCount = 0;
        let shapeshifterCount = 0;

        for (let i = 0; i < 11; i++) {
          const card = squad[i];
          const slot = slots[i];
          if (!card) continue;
          const exactMatch = card.pos === slot.pos || card.tier === 'shapeshifter';
          const groupMatch = getPositionGroup(card.pos) === slot.role;
          if (!exactMatch && !groupMatch) {
            oopPenalties[i] = true;
          }
          if (card.tier === 'icon') iconCount += 1;
          if (card.tier === 'shapeshifter') shapeshifterCount += 1;
          nationCounts[card.nation] = (nationCounts[card.nation] || 0) + 1;
          const cw = card.tier === 'hero' ? 2 : 1;
          clubCounts[card.club] = (clubCounts[card.club] || 0) + cw;
          leagueCounts[card.league] = (leagueCounts[card.league] || 0) + cw;
        }

        let ratingSum = 0;
        let count = 0;

        for (let i = 0; i < 11; i++) {
          const card = squad[i];
          if (!card) continue;
          count += 1;
          ratingSum += oopPenalties[i] ? Math.max(40, card.ovr - 6) : card.ovr;
          if (oopPenalties[i]) {
            playerChems[i] = 0;
            continue;
          }
          if (card.tier === 'icon' || card.tier === 'hero' || card.tier === 'shapeshifter') {
            playerChems[i] = 3;
            continue;
          }
          let pts = 0;
          const nCount = (nationCounts[card.nation] || 0) + iconCount;
          const cCount = (clubCounts[card.club] || 0) + shapeshifterCount;
          const lCount = (leagueCounts[card.league] || 0) + iconCount + shapeshifterCount;
          if (nCount >= 5) pts += 2;
          else if (nCount >= 2) pts += 1;
          if (cCount >= 4) pts += 2;
          else if (cCount >= 2) pts += 1;
          if (lCount >= 5) pts += 2;
          else if (lCount >= 3) pts += 1;
          playerChems[i] = Math.min(3, pts);
        }

        return {
          totalChem: playerChems.reduce((a, b) => a + b, 0),
          playerChems,
          oopPenalties,
          avgRating: count > 0 ? Math.round(ratingSum / count) : 0,
        };
      }

      function evaluateSBC(criteria, cards) {
        const reasons = [];
        if (cards.length < criteria.requiredCount) {
          reasons.push(`Need ${criteria.requiredCount} players (${cards.length}/${criteria.requiredCount})`);
        }
        const avgOvr = cards.length > 0 ? Math.round(cards.reduce((s, c) => s + c.ovr, 0) / cards.length) : 0;
        if (avgOvr < criteria.minAvgOvr) {
          reasons.push(`Avg Rating ${avgOvr} < ${criteria.minAvgOvr}`);
        }
        if (criteria.minShapeshifters) {
          const ss = cards.filter((c) => c.tier === 'shapeshifter').length;
          if (ss < criteria.minShapeshifters) reasons.push(`Shapeshifters ${ss}/${criteria.minShapeshifters}`);
        }
        if (criteria.minTotwOrSpecial) {
          const sp = cards.filter((c) => ['totw', 'hero', 'icon', 'shapeshifter'].includes(c.tier)).length;
          if (sp < criteria.minTotwOrSpecial) reasons.push(`Special Cards ${sp}/${criteria.minTotwOrSpecial}`);
        }
        if (criteria.minNations) {
          const n = new Set(cards.map((c) => c.nation)).size;
          if (n < criteria.minNations) reasons.push(`Nations ${n}/${criteria.minNations}`);
        }
        return { valid: reasons.length === 0, reasons, avgOvr };
      }

      function rollPackCards(packType, rng) {
        const weights = {
          bronze: { bronze: 65, silver: 30, gold: 5, elite: 0, totw: 0, hero: 0, icon: 0, shapeshifter: 0 },
          gold: { bronze: 0, silver: 25, gold: 52, elite: 14, totw: 5, hero: 2, icon: 1, shapeshifter: 1 },
          elite: { bronze: 0, silver: 0, gold: 32, elite: 36, totw: 15, hero: 8, icon: 4, shapeshifter: 5 },
          shapeshifter: { bronze: 0, silver: 0, gold: 15, elite: 25, totw: 15, hero: 10, icon: 5, shapeshifter: 30 },
          icon: { bronze: 0, silver: 0, gold: 10, elite: 25, totw: 15, hero: 15, icon: 25, shapeshifter: 10 },
        };
        const tierTable = weights[packType] || weights.gold;
        const tiers = Object.keys(tierTable);
        const total = tiers.reduce((acc, t) => acc + tierTable[t], 0);

        const pickTier = (lead) => {
          if (lead && packType === 'shapeshifter') return 'shapeshifter';
          if (lead && packType === 'icon') return 'icon';
          if (lead && packType === 'elite') return rng() < 0.55 ? 'elite' : rng() < 0.5 ? 'totw' : 'hero';
          let r = rng() * total;
          for (const t of tiers) {
            r -= tierTable[t];
            if (r <= 0) return t;
          }
          return 'gold';
        };

        const cards = [];
        for (let i = 0; i < 3; i++) {
          const tier = pickTier(i === 0);
          const matching = PLAYER_POOL.filter((p) => p.tier === tier);
          const src = matching.length > 0 ? matching : PLAYER_POOL;
          cards.push(src[Math.floor(rng() * src.length)]);
        }
        cards.sort((a, b) => b.ovr - a.ovr);
        const bestCard = cards[0];
        const isSpecial = ['totw', 'hero', 'icon', 'shapeshifter'].includes(bestCard.tier);
        const isWalkout = bestCard.ovr >= 86 || isSpecial;
        return { cards, bestCard, isWalkout };
      }

      /* =========================================================================
         7. LIVE 2D PITCH ENGINE (<canvas> 22-DOT SIMULATION)
      ========================================================================= */
      function buildMatchDots(homeSquad, homeFormation, awaySquad, awayFormation) {
        const PITCH_W = 960;
        const PITCH_H = 580;
        const hSlots = FORMATIONS[homeFormation] || FORMATIONS['4-3-3'];
        const aSlots = FORMATIONS[awayFormation] || FORMATIONS['4-3-3'];
        const dots = [];

        for (let i = 0; i < 11; i++) {
          const hc = homeSquad[i] || PLAYER_POOL[i];
          const hs = hSlots[i];
          const hx = 40 + hs.x * (PITCH_W - 80);
          const hy = 30 + hs.y * (PITCH_H - 60);
          dots.push({
            id: `h-${i}`,
            team: 'home',
            slotIndex: i,
            shirtNum: hc.shirtNum || i + 1,
            name: hc.name,
            role: hs.role,
            x: hx,
            y: hy,
            vx: 0,
            vy: 0,
            homeX: hx,
            homeY: hy,
            pac: hc.stats.pac,
            sho: hc.stats.sho,
            pas: hc.stats.pas,
            dri: hc.stats.dri,
            def: hc.stats.def,
            redCarded: false,
            yellowCards: 0,
            diveTimer: 0,
            diveVy: 0,
          });

          const ac = awaySquad[i] || PLAYER_POOL[(i + 12) % PLAYER_POOL.length];
          const as = aSlots[i];
          const ax = PITCH_W - (40 + as.x * (PITCH_W - 80));
          const ay = 30 + (1 - as.y) * (PITCH_H - 60);
          dots.push({
            id: `a-${i}`,
            team: 'away',
            slotIndex: i,
            shirtNum: ac.shirtNum || i + 1,
            name: ac.name,
            role: as.role,
            x: ax,
            y: ay,
            vx: 0,
            vy: 0,
            homeX: ax,
            homeY: ay,
            pac: ac.stats.pac,
            sho: ac.stats.sho,
            pas: ac.stats.pas,
            dri: ac.stats.dri,
            def: ac.stats.def,
            redCarded: false,
            yellowCards: 0,
            diveTimer: 0,
            diveVy: 0,
          });
        }
        return dots;
      }

      function PitchCanvas({
        homeName,
        awayName,
        homeSquad,
        awaySquad,
        homeFormation = '4-3-3',
        awayFormation = '4-3-3',
        awayKit = '#ef4444',
        seed = 1337,
        paused = false,
        ambientOnly = false,
        roomSyncRef = null,
        onMatchEnd,
        onPauseToggle,
      }) {
        const canvasRef = useRef(null);
        const simRef = useRef(null);
        const speedRef = useRef(1);
        const [speed, setSpeed] = useState(1);
        const [hud, setHud] = useState({
          minute: 0,
          homeScore: 0,
          awayScore: 0,
          homeShots: 0,
          awayShots: 0,
          homePoss: 50,
          commentary: 'Kickoff! The stadium floodlights are blazing!',
        });
        const [tickerLog, setTickerLog] = useState(['00\' Kickoff! Both squads take their positions.']);
        const onMatchEndRef = useRef(onMatchEnd);
        onMatchEndRef.current = onMatchEnd;

        useEffect(() => {
          speedRef.current = speed;
        }, [speed]);

        useEffect(() => {
          const PITCH_W = 960;
          const PITCH_H = 580;
          const rng = createSeededRng(seed);
          const dots = buildMatchDots(homeSquad, homeFormation, awaySquad, awayFormation);
          const state = {
            pitchW: PITCH_W,
            pitchH: PITCH_H,
            dots,
            ball: {
              x: PITCH_W / 2,
              y: PITCH_H / 2,
              z: 0,
              vx: (rng() - 0.5) * 180,
              vy: (rng() - 0.5) * 140,
              vz: 0,
              ownerId: null,
              lastTouchTeam: null,
              kickCooldown: 0,
            },
            homeScore: 0,
            awayScore: 0,
            homeShots: 0,
            awayShots: 0,
            homePossTicks: 1,
            awayPossTicks: 1,
            elapsedMinutes: 0,
            freezeTicks: 0,
            goalBannerTimer: 0,
            netRippleTimer: 0,
            flagPhase: 0,
            lastPassLine: null,
            passLineTimer: 0,
            finished: false,
          };
          simRef.current = state;

          if (!ambientOnly) {
            audioFX.playWhistle('short');
          }

          let animId = 0;
          let lastTime = performance.now();
          let hudSyncAccum = 0;
          let lastCommentary = 'Kickoff! Both sides probing for an opening.';

          const pushComment = (min, text) => {
            const line = `${String(Math.min(90, Math.floor(min))).padStart(2, '0')}' ${text}`;
            lastCommentary = line;
            setTickerLog((prev) => [line, ...prev].slice(0, 8));
          };

          const resetKO = () => {
            state.ball.x = PITCH_W / 2;
            state.ball.y = PITCH_H / 2;
            state.ball.z = 0;
            state.ball.vx = (rng() - 0.5) * 120;
            state.ball.vy = (rng() - 0.5) * 120;
            state.ball.vz = 0;
            state.ball.ownerId = null;
            state.ball.kickCooldown = 0.45;
            state.dots.forEach((d) => {
              d.x = d.homeX;
              d.y = d.homeY;
              d.vx = 0;
              d.vy = 0;
              d.diveTimer = 0;
            });
          };

          const stepSim = (dt) => {
            state.flagPhase += dt * 5;
            if (state.netRippleTimer > 0) state.netRippleTimer = Math.max(0, state.netRippleTimer - dt);
            if (state.passLineTimer > 0) state.passLineTimer = Math.max(0, state.passLineTimer - dt);
            if (state.goalBannerTimer > 0) state.goalBannerTimer = Math.max(0, state.goalBannerTimer - dt);

            if (state.freezeTicks > 0) {
              state.freezeTicks -= 1;
              return;
            }

            if (!ambientOnly) {
              // 90 mins in ~45 seconds at 1x speed (2 game mins per real second)
              state.elapsedMinutes += dt * 2.0;
              if (state.elapsedMinutes >= 90 && !state.finished) {
                state.finished = true;
                audioFX.playWhistle('fulltime');
                pushComment(90, `FULL TIME! ${homeName} ${state.homeScore} - ${state.awayScore} ${awayName}`);
                if (onMatchEndRef.current) {
                  const totalP = state.homePossTicks + state.awayPossTicks;
                  onMatchEndRef.current({
                    homeScore: state.homeScore,
                    awayScore: state.awayScore,
                    homeShots: state.homeShots,
                    awayShots: state.awayShots,
                    homePoss: Math.round((state.homePossTicks / totalP) * 100),
                  });
                }
                return;
              }
            }

            const { ball } = state;
            if (ball.kickCooldown > 0) ball.kickCooldown = Math.max(0, ball.kickCooldown - dt);

            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;
            ball.z = Math.max(0, ball.z + ball.vz * dt);
            if (ball.z > 0) {
              ball.vz -= 420 * dt;
              if (ball.z <= 0) {
                ball.z = 0;
                ball.vz = Math.abs(ball.vz) > 45 ? -ball.vz * 0.45 : 0;
              }
            }
            const friction = ball.z > 2 ? 0.992 : 0.976;
            ball.vx *= Math.pow(friction, dt * 60);
            ball.vy *= Math.pow(friction, dt * 60);

            const goalTop = PITCH_H * 0.37;
            const goalBot = PITCH_H * 0.63;
            const inGoalMouthY = ball.y >= goalTop && ball.y <= goalBot;

            if (ball.x <= 24) {
              if (inGoalMouthY) {
                state.awayScore += 1;
                state.goalBannerTimer = 1.9;
                state.netRippleTimer = 1.6;
                state.freezeTicks = 32;
                if (!ambientOnly) {
                  audioFX.playGoalRoar();
                  pushComment(state.elapsedMinutes, `GOAL! ${awayName} smash it into the corner!`);
                }
                resetKO();
                return;
              }
              ball.x = 26;
              ball.vx = Math.abs(ball.vx) * 0.72;
              if (Math.abs(ball.y - goalTop) < 14 || Math.abs(ball.y - goalBot) < 14) {
                if (!ambientOnly) {
                  audioFX.playPostClang();
                  pushComment(state.elapsedMinutes, 'CLANG! Off the woodwork!!');
                }
              }
            } else if (ball.x >= PITCH_W - 24) {
              if (inGoalMouthY) {
                state.homeScore += 1;
                state.goalBannerTimer = 1.9;
                state.netRippleTimer = 1.6;
                state.freezeTicks = 32;
                if (!ambientOnly) {
                  audioFX.playGoalRoar();
                  pushComment(state.elapsedMinutes, `GOOOAL!! ${homeName} fire a thunderbolt past the keeper!`);
                }
                resetKO();
                return;
              }
              ball.x = PITCH_W - 26;
              ball.vx = -Math.abs(ball.vx) * 0.72;
              if (Math.abs(ball.y - goalTop) < 14 || Math.abs(ball.y - goalBot) < 14) {
                if (!ambientOnly) {
                  audioFX.playPostClang();
                  pushComment(state.elapsedMinutes, 'WOODWORK! Inches away from glory!');
                }
              }
            }

            if (ball.y <= 22) {
              ball.y = 24;
              ball.vy = Math.abs(ball.vy) * 0.78;
            } else if (ball.y >= PITCH_H - 22) {
              ball.y = PITCH_H - 24;
              ball.vy = -Math.abs(ball.vy) * 0.78;
            }

            if (ball.lastTouchTeam === 'home') state.homePossTicks += 1;
            else if (ball.lastTouchTeam === 'away') state.awayPossTicks += 1;

            let nearestHome = null;
            let nearestHomeDist = Infinity;
            let nearestAway = null;
            let nearestAwayDist = Infinity;

            for (const d of state.dots) {
              if (d.redCarded || d.role === 'GK') continue;
              const dist = Math.hypot(ball.x - d.x, ball.y - d.y);
              if (d.team === 'home' && dist < nearestHomeDist) {
                nearestHomeDist = dist;
                nearestHome = d;
              }
              if (d.team === 'away' && dist < nearestAwayDist) {
                nearestAwayDist = dist;
                nearestAway = d;
              }
            }

            const ballRatioX = ball.x / PITCH_W;

            for (const dot of state.dots) {
              if (dot.redCarded) continue;

              if (dot.diveTimer > 0) {
                dot.diveTimer = Math.max(0, dot.diveTimer - dt);
                dot.y = Math.max(goalTop - 8, Math.min(goalBot + 8, dot.y + dot.diveVy * dt));
                continue;
              }

              const isOwner = ball.ownerId === dot.id;
              const speedBase = 92 + dot.pac * 1.15;
              let targetX = dot.homeX;
              let targetY = dot.homeY;

              if (dot.role === 'GK') {
                targetX = dot.team === 'home' ? 42 : PITCH_W - 42;
                targetY = Math.max(goalTop + 12, Math.min(goalBot - 12, ball.y));
              } else if (isOwner) {
                const attackDir = dot.team === 'home' ? 1 : -1;
                targetX = dot.x + attackDir * 125;
                targetY = dot.y + (PITCH_H * 0.5 - dot.y) * 0.25;
              } else if (dot === nearestHome || dot === nearestAway) {
                targetX = ball.x;
                targetY = ball.y;
              } else {
                const shiftX = (ballRatioX - 0.5) * PITCH_W * 0.34;
                targetX = Math.max(48, Math.min(PITCH_W - 48, dot.homeX + shiftX));
                targetY = Math.max(36, Math.min(PITCH_H - 36, dot.homeY + (ball.y - PITCH_H * 0.5) * 0.22));
              }

              const dx = targetX - dot.x;
              const dy = targetY - dot.y;
              const dist = Math.hypot(dx, dy);

              if (dist > 3) {
                const turnRate = 0.08 + (dot.dri / 100) * 0.14;
                const desiredVx = (dx / dist) * speedBase;
                const desiredVy = (dy / dist) * speedBase;
                dot.vx += (desiredVx - dot.vx) * turnRate;
                dot.vy += (desiredVy - dot.vy) * turnRate;
                dot.x = Math.max(28, Math.min(PITCH_W - 28, dot.x + dot.vx * dt));
                dot.y = Math.max(26, Math.min(PITCH_H - 26, dot.y + dot.vy * dt));
              }

              const ballDist = Math.hypot(ball.x - dot.x, ball.y - dot.y);
              const reach = dot.role === 'GK' ? 20 : 14 + (dot.def > 80 ? 3 : 0);

              if (ballDist < reach && ball.z < 26 && ball.kickCooldown <= 0) {
                if (dot.role === 'GK') {
                  const clearDir = dot.team === 'home' ? 1 : -1;
                  ball.ownerId = null;
                  ball.lastTouchTeam = dot.team;
                  ball.vx = clearDir * (295 + rng() * 115);
                  ball.vy = (rng() - 0.5) * 230;
                  ball.vz = 145;
                  ball.kickCooldown = 0.28;
                  dot.diveTimer = 0.34;
                  dot.diveVy = (ball.y - dot.y) * 2.4;
                  if (!ambientOnly) {
                    audioFX.playKick(1.1);
                    if (Math.hypot(ball.vx, ball.vy) > 310) {
                      pushComment(state.elapsedMinutes, `Diving fingertip save by ${dot.name}!`);
                    }
                  }
                } else if (!ball.ownerId || (ball.lastTouchTeam !== dot.team && rng() < 0.28 + (dot.def / 100) * 0.45)) {
                  if (ball.ownerId && ball.lastTouchTeam !== dot.team) {
                    // Sliding tackle & rare yellow/red card
                    if (!ambientOnly && rng() < 0.055) {
                      audioFX.playWhistle('short');
                      audioFX.playCardBook();
                      dot.yellowCards += 1;
                      if (dot.yellowCards >= 2) {
                        dot.redCarded = true;
                        pushComment(state.elapsedMinutes, `RED CARD! ${dot.name} is sent off for a wild slide!`);
                      } else {
                        pushComment(state.elapsedMinutes, `YELLOW CARD! ${dot.name} booked for a late tackle.`);
                      }
                      ball.ownerId = null;
                      ball.vx = (dot.team === 'home' ? -1 : 1) * 140;
                      ball.vy = (rng() - 0.5) * 80;
                      ball.kickCooldown = 0.45;
                      state.freezeTicks = 18;
                      continue;
                    }
                  }
                  ball.ownerId = dot.id;
                  ball.lastTouchTeam = dot.team;
                  ball.kickCooldown = 0.16;
                }
              }

              if (ball.ownerId === dot.id) {
                ball.x = dot.x + (dot.team === 'home' ? 10 : -10);
                ball.y = dot.y;
                ball.vx = dot.vx;
                ball.vy = dot.vy;

                const goalX = dot.team === 'home' ? PITCH_W - 24 : 24;
                const distToGoal = Math.hypot(goalX - dot.x, PITCH_H * 0.5 - dot.y);

                if (distToGoal < 245 && rng() < 0.085 + (dot.sho / 100) * 0.09) {
                  const aimY = PITCH_H * (0.38 + rng() * 0.24);
                  const sdx = goalX - dot.x;
                  const sdy = aimY - dot.y;
                  const sLen = Math.hypot(sdx, sdy) || 1;
                  const shotSpeed = 390 + dot.sho * 2.7;
                  ball.ownerId = null;
                  ball.vx = (sdx / sLen) * shotSpeed;
                  ball.vy = (sdy / sLen) * shotSpeed;
                  ball.vz = 45 + rng() * 80;
                  ball.kickCooldown = 0.3;
                  if (dot.team === 'home') state.homeShots += 1;
                  else state.awayShots += 1;
                  if (!ambientOnly) {
                    audioFX.playKick(1.3);
                    pushComment(state.elapsedMinutes, `${dot.name} unleashes a venomous strike!`);
                  }
                } else if (rng() < 0.055 + (dot.pas / 100) * 0.065) {
                  const mates = state.dots.filter((m) => m.team === dot.team && m.id !== dot.id && !m.redCarded);
                  if (mates.length > 0) {
                    const fwd = mates.filter((m) => (dot.team === 'home' ? m.x > dot.x - 24 : m.x < dot.x + 24));
                    const pool = fwd.length > 0 ? fwd : mates;
                    const target = pool[Math.floor(rng() * pool.length)];

                    // Occasional offside call on long forward pass
                    if (!ambientOnly && target.role === 'FWD' && rng() < 0.035) {
                      audioFX.playWhistle('short');
                      pushComment(state.elapsedMinutes, `OFFSIDE! ${target.name} caught a step too early.`);
                      ball.ownerId = null;
                      ball.vx = 0;
                      ball.vy = 0;
                      ball.kickCooldown = 0.45;
                      state.freezeTicks = 14;
                      continue;
                    }

                    const err = ((100 - dot.pas) / 100) * 40;
                    const pdx = target.x + (rng() - 0.5) * err - dot.x;
                    const pdy = target.y + (rng() - 0.5) * err - dot.y;
                    const pLen = Math.hypot(pdx, pdy) || 1;
                    const passSpeed = Math.min(395, 215 + pLen * 0.85);
                    ball.ownerId = null;
                    ball.vx = (pdx / pLen) * passSpeed;
                    ball.vy = (pdy / pLen) * passSpeed;
                    ball.vz = pLen > 180 ? 115 : 8;
                    ball.kickCooldown = 0.22;
                    state.lastPassLine = { x1: dot.x, y1: dot.y, x2: target.x, y2: target.y };
                    state.passLineTimer = 0.24;
                    if (!ambientOnly) audioFX.playKick(0.8);
                  }
                }
              }
            }
          };

          const drawPitch = (ctx) => {
            // Turf mowed stripes
            const stripeCount = 12;
            const stripeW = PITCH_W / stripeCount;
            for (let i = 0; i < stripeCount; i++) {
              ctx.fillStyle = i % 2 === 0 ? '#0b4728' : '#0e5732';
              ctx.fillRect(i * stripeW, 0, stripeW + 1, PITCH_H);
            }

            // Neon-emerald & crisp white pitch markings
            ctx.strokeStyle = '#6ee7b7';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(24, 22, PITCH_W - 48, PITCH_H - 44);

            // Halfway line & center circle
            ctx.beginPath();
            ctx.moveTo(PITCH_W / 2, 22);
            ctx.lineTo(PITCH_W / 2, PITCH_H - 22);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(PITCH_W / 2, PITCH_H / 2, 68, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#6ee7b7';
            ctx.beginPath();
            ctx.arc(PITCH_W / 2, PITCH_H / 2, 4, 0, Math.PI * 2);
            ctx.fill();

            // Penalty Boxes & 6-Yard Boxes
            ctx.strokeRect(24, PITCH_H * 0.22, 130, PITCH_H * 0.56);
            ctx.strokeRect(24, PITCH_H * 0.35, 50, PITCH_H * 0.3);
            ctx.strokeRect(PITCH_W - 154, PITCH_H * 0.22, 130, PITCH_H * 0.56);
            ctx.strokeRect(PITCH_W - 74, PITCH_H * 0.35, 50, PITCH_H * 0.3);

            // Penalty D arcs
            ctx.beginPath();
            ctx.arc(118, PITCH_H / 2, 54, -0.7, 0.7);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(PITCH_W - 118, PITCH_H / 2, 54, Math.PI - 0.7, Math.PI + 0.7);
            ctx.stroke();

            // Subtle offside line indicator
            const awayDefenders = state.dots
              .filter((d) => d.team === 'away' && !d.redCarded && d.role !== 'GK')
              .sort((a, b) => b.x - a.x);
            if (awayDefenders.length > 0) {
              const lineX = awayDefenders[0].x;
              ctx.save();
              ctx.setLineDash([5, 6]);
              ctx.strokeStyle = 'rgba(250, 204, 21, 0.22)';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(lineX, 24);
              ctx.lineTo(lineX, PITCH_H - 24);
              ctx.stroke();
              ctx.restore();
            }

            // Goals with ripple on score
            const gTop = PITCH_H * 0.37;
            const gH = PITCH_H * 0.26;
            const ripple = state.netRippleTimer > 0 ? Math.sin(state.flagPhase * 6) * 4 : 0;
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.fillRect(6 + ripple, gTop, 18, gH);
            ctx.strokeRect(6 + ripple, gTop, 18, gH);
            ctx.fillRect(PITCH_W - 24 + ripple, gTop, 18, gH);
            ctx.strokeRect(PITCH_W - 24 + ripple, gTop, 18, gH);

            // Animated Corner Flags
            const corners = [
              [24, 22],
              [PITCH_W - 24, 22],
              [24, PITCH_H - 22],
              [PITCH_W - 24, PITCH_H - 22],
            ];
            corners.forEach(([cx, cy], idx) => {
              const wave = Math.sin(state.flagPhase + idx) * 3;
              ctx.fillStyle = '#ffd600';
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.lineTo(cx + 10, cy - 5 + wave);
              ctx.lineTo(cx, cy - 10);
              ctx.closePath();
              ctx.fill();
            });

            // Pass line preview
            if (state.passLineTimer > 0 && state.lastPassLine) {
              ctx.save();
              ctx.setLineDash([4, 4]);
              ctx.strokeStyle = 'rgba(0, 230, 118, 0.55)';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(state.lastPassLine.x1, state.lastPassLine.y1);
              ctx.lineTo(state.lastPassLine.x2, state.lastPassLine.y2);
              ctx.stroke();
              ctx.restore();
            }

            // 22 Active Dots
            for (const dot of state.dots) {
              if (dot.redCarded) continue;
              const isCarrier = state.ball.ownerId === dot.id;
              if (isCarrier) {
                ctx.strokeStyle = '#ffd600';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, 17, 0, Math.PI * 2);
                ctx.stroke();
              }

              // Shadow
              ctx.fillStyle = 'rgba(0,0,0,0.4)';
              ctx.beginPath();
              ctx.ellipse(dot.x, dot.y + 8, 10, 5, 0, 0, Math.PI * 2);
              ctx.fill();

              // Player circle
              ctx.fillStyle = dot.role === 'GK' ? (dot.team === 'home' ? '#facc15' : '#a855f7') : dot.team === 'home' ? '#0ea5e9' : awayKit;
              ctx.beginPath();
              ctx.arc(dot.x, dot.y, 11.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = dot.yellowCards > 0 ? '#ffd600' : '#ffffff';
              ctx.lineWidth = 2;
              ctx.stroke();

              // Shirt number
              ctx.fillStyle = dot.role === 'GK' && dot.team === 'home' ? '#0f172a' : '#ffffff';
              ctx.font = 'bold 10px monospace';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(String(dot.shirtNum), dot.x, dot.y + 0.5);

              if (isCarrier && !ambientOnly) {
                ctx.fillStyle = 'rgba(7,11,18,0.85)';
                ctx.fillRect(dot.x - 36, dot.y - 25, 72, 13);
                ctx.fillStyle = '#00e676';
                ctx.font = 'bold 9px monospace';
                ctx.fillText(dot.name.slice(0, 11), dot.x, dot.y - 18);
              }
            }

            // Ball Shadow & Ball with Z height arc
            const b = state.ball;
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.beginPath();
            ctx.ellipse(b.x, b.y + 5, 6.5, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();

            const scale = 1 + b.z * 0.012;
            const drawY = b.y - b.z * 0.45;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(b.x, drawY, 6 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1.6;
            ctx.stroke();

            // Goal Celebration Banner
            if (state.goalBannerTimer > 0 && !ambientOnly) {
              ctx.fillStyle = 'rgba(7, 11, 18, 0.85)';
              ctx.fillRect(PITCH_W / 2 - 190, PITCH_H / 2 - 38, 380, 76);
              ctx.strokeStyle = '#ffd600';
              ctx.lineWidth = 4;
              ctx.strokeRect(PITCH_W / 2 - 190, PITCH_H / 2 - 38, 380, 76);
              ctx.fillStyle = '#ffd600';
              ctx.font = 'bold 28px "Press Start 2P", monospace';
              ctx.textAlign = 'center';
              ctx.fillText('GOOOAL!!', PITCH_W / 2, PITCH_H / 2 + 2);
            }
          };

          const loop = (now) => {
            const rawDt = (now - lastTime) / 1000;
            lastTime = now;
            const dt = Math.min(rawDt, 0.05);

            if (!paused && !state.finished) {
              const mult = ambientOnly ? 1 : speedRef.current;
              for (let s = 0; s < mult; s++) {
                stepSim(dt);
              }
            }

            const canvas = canvasRef.current;
            if (canvas) {
              const ctx = canvas.getContext('2d');
              if (ctx) drawPitch(ctx);
            }

            if (!ambientOnly) {
              hudSyncAccum += dt;
              if (hudSyncAccum >= 0.12) {
                hudSyncAccum = 0;
                const totalP = state.homePossTicks + state.awayPossTicks;
                setHud({
                  minute: Math.min(90, Math.floor(state.elapsedMinutes)),
                  homeScore: state.homeScore,
                  awayScore: state.awayScore,
                  homeShots: state.homeShots,
                  awayShots: state.awayShots,
                  homePoss: Math.round((state.homePossTicks / totalP) * 100),
                  commentary: lastCommentary,
                });

                if (roomSyncRef && roomSyncRef.current) {
                  roomSyncRef.current({
                    minute: Math.min(90, Math.floor(state.elapsedMinutes)),
                    homeScore: state.homeScore,
                    awayScore: state.awayScore,
                  });
                }
              }
            }

            animId = requestAnimationFrame(loop);
          };

          animId = requestAnimationFrame(loop);
          return () => cancelAnimationFrame(animId);
        }, [seed, paused, ambientOnly, homeFormation, awayFormation, awayKit]);

        if (ambientOnly) {
          return (
            <canvas
              ref={canvasRef}
              width={960}
              height={580}
              className="w-full h-full object-cover opacity-45"
              data-testid="ambient-pitch-canvas"
            />
          );
        }

        return (
          <div className="flex flex-col gap-2.5 w-full max-w-4xl mx-auto">
            {/* Live Scoreboard HUD */}
            <div className="pixel-panel px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-4">
                <div className="text-right">
                  <div className="text-xs text-sky-400 font-bold">{homeName}</div>
                  <div className="text-[10px] text-slate-400 tabular-nums">
                    POSS {hud.homePoss}% · SHOTS {hud.homeShots}
                  </div>
                </div>
                <div className="px-4 py-1 bg-slate-950 border-2 border-emerald-400 font-arcade text-lg text-white tabular-nums">
                  {hud.homeScore} - {hud.awayScore}
                </div>
                <div className="text-left">
                  <div className="text-xs text-rose-400 font-bold">{awayName}</div>
                  <div className="text-[10px] text-slate-400 tabular-nums">
                    POSS {100 - hud.homePoss}% · SHOTS {hud.awayShots}
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <span className="px-3 py-1 bg-slate-950 border border-amber-400 font-arcade text-xs text-amber-300 tabular-nums">
                  {String(hud.minute).padStart(2, '0')}&apos;
                </span>
                {[1, 2, 4].map((spd) => (
                  <button
                    key={spd}
                    type="button"
                    onClick={() => {
                      audioFX.playClick();
                      setSpeed(spd);
                    }}
                    className={`px-2.5 py-1 text-xs font-bold pixel-btn ${
                      speed === spd ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300'
                    }`}
                  >
                    {spd}X
                  </button>
                ))}
                {onPauseToggle && (
                  <button
                    type="button"
                    onClick={() => {
                      audioFX.playClick();
                      onPauseToggle();
                    }}
                    className="px-3 py-1 text-xs bg-slate-800 text-slate-200 pixel-btn"
                  >
                    PAUSE [P]
                  </button>
                )}
              </div>
            </div>

            {/* Possession Meter Bar */}
            <div className="h-2 w-full bg-rose-500 border border-black overflow-hidden flex">
              <div className="bg-sky-400 h-full transition-all duration-150" style={{ width: `${hud.homePoss}%` }} />
            </div>

            {/* Interactive 2D Pitch Canvas */}
            <div className="relative border-4 border-slate-800 bg-[#0b4728] shadow-2xl overflow-hidden mx-auto w-full max-w-[820px]">
              <canvas
                ref={canvasRef}
                width={960}
                height={580}
                className="w-full aspect-[960/580] block"
                data-testid="match-pitch-canvas"
              />
            </div>

            {/* Live 8-Bit Commentary Ticker */}
            <div className="pixel-panel px-4 py-2">
              <div className="font-vt text-xl text-emerald-300 tracking-wide truncate">{hud.commentary}</div>
              <div className="mt-0.5 flex flex-col gap-0.5 max-h-14 overflow-y-auto font-vt text-base text-slate-400">
                {tickerLog.slice(1, 4).map((line, idx) => (
                  <div key={idx} className="truncate">
                    {line}
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      /* =========================================================================
         8. PENALTY SHOOTOUT SUDDEN-DEATH MINI-GAME
      ========================================================================= */
      function PenaltyShootoutGame({ striker, keeper, onComplete, onExit }) {
        const [phase, setPhase] = useState('SHOOT'); // 'SHOOT' | 'DIVE' | 'RESULT'
        const [round, setRound] = useState(1);
        const [playerGoals, setPlayerGoals] = useState(0);
        const [botGoals, setBotGoals] = useState(0);
        const [history, setHistory] = useState([]);
        const [message, setMessage] = useState('AIM A ZONE TO SHOOT!');
        const [lastBallPos, setLastBallPos] = useState({ x: 50, y: 80 });
        const [keeperPos, setKeeperPos] = useState(1); // 0 left, 1 center, 2 right
        const [locked, setLocked] = useState(false);

        const zones = [
          { id: 0, label: 'TOP LEFT', x: 18, y: 24, col: 0 },
          { id: 1, label: 'TOP CENTER', x: 50, y: 22, col: 1 },
          { id: 2, label: 'TOP RIGHT', x: 82, y: 24, col: 2 },
          { id: 3, label: 'BOT LEFT', x: 18, y: 74, col: 0 },
          { id: 4, label: 'BOT CENTER', x: 50, y: 74, col: 1 },
          { id: 5, label: 'BOT RIGHT', x: 82, y: 74, col: 2 },
        ];

        const checkFinish = (pG, bG, nextRound) => {
          const kicksLeft = Math.max(0, 5 - nextRound + 1);
          if (nextRound <= 5) {
            if (pG > bG + kicksLeft || bG > pG + kicksLeft) {
              return true;
            }
            return false;
          }
          // Sudden death after 5
          return pG !== bG;
        };

        const handleZoneClick = (zone) => {
          if (locked || phase === 'RESULT') return;
          setLocked(true);
          audioFX.playKick(1.2);

          if (phase === 'SHOOT') {
            const botDiveCol = Math.floor(Math.random() * 3);
            setKeeperPos(botDiveCol);
            setLastBallPos({ x: zone.x, y: zone.y });
            const accuracyBoost = (striker?.stats?.sho || 80) / 100;
            const saved = botDiveCol === zone.col && Math.random() > 0.28 * accuracyBoost;

            if (saved) {
              audioFX.playPostClang();
              setMessage('SAVED BY THE KEEPER!');
              setHistory((h) => [...h, `R${round}: YOU MISSED`]);
            } else {
              audioFX.playGoalRoar();
              setMessage(`GOOOAL! ${striker?.name || 'Striker'} buries it!`);
              setPlayerGoals((g) => g + 1);
              setHistory((h) => [...h, `R${round}: YOU SCORED`]);
            }

            setTimeout(() => {
              setLastBallPos({ x: 50, y: 80 });
              setKeeperPos(1);
              setPhase('DIVE');
              setMessage('PICK A SIDE TO DIVE!');
              setLocked(false);
            }, 950);
          } else if (phase === 'DIVE') {
            const botAim = zones[Math.floor(Math.random() * zones.length)];
            setKeeperPos(zone.col);
            setLastBallPos({ x: botAim.x, y: botAim.y });
            const keeperBoost = (keeper?.stats?.def || 80) / 100;
            const saved = zone.col === botAim.col && Math.random() < 0.72 + 0.2 * keeperBoost;

            let nextBotGoals = botGoals;
            if (saved) {
              audioFX.playWhistle('short');
              setMessage(`INCREDIBLE SAVE BY ${keeper?.name || 'KEEPER'}!`);
              setHistory((h) => [...h, `R${round}: SAVED CPU`]);
            } else {
              audioFX.playGoalRoar();
              nextBotGoals += 1;
              setBotGoals(nextBotGoals);
              setMessage('CPU SCORES!');
              setHistory((h) => [...h, `R${round}: CPU SCORED`]);
            }

            setTimeout(() => {
              const nextR = round + 1;
              if (checkFinish(playerGoals, nextBotGoals, nextR)) {
                setPhase('RESULT');
                const won = playerGoals > nextBotGoals;
                audioFX.playWhistle('fulltime');
                setMessage(won ? 'SHOOTOUT VICTORY!' : 'HEARTBREAK DEFEAT!');
                if (onComplete) onComplete(won, playerGoals, nextBotGoals);
              } else {
                setRound(nextR);
                setLastBallPos({ x: 50, y: 80 });
                setKeeperPos(1);
                setPhase('SHOOT');
                setMessage(nextR > 5 ? 'SUDDEN DEATH! AIM YOUR SHOT!' : 'AIM A ZONE TO SHOOT!');
              }
              setLocked(false);
            }, 950);
          }
        };

        return (
          <div className="max-w-3xl mx-auto flex flex-col gap-4">
            <div className="pixel-panel p-4 flex items-center justify-between gap-4">
              <div>
                <div className="font-arcade text-sm text-amber-300">PENALTY SHOOTOUT</div>
                <div className="font-vt text-xl text-slate-300">
                  Round {round} {round > 5 ? '(SUDDEN DEATH)' : 'of 5'} · {message}
                </div>
              </div>
              <div className="flex items-center gap-3">
                <div className="px-4 py-2 bg-slate-950 border-2 border-emerald-400 font-arcade text-lg tabular-nums">
                  {playerGoals} - {botGoals}
                </div>
                <button type="button" onClick={onExit} className="px-3 py-2 text-xs bg-slate-800 pixel-btn">
                  EXIT
                </button>
              </div>
            </div>

            {/* Interactive Goal Frame */}

      function randomSaltHex() {
        const bytes = new Uint8Array(12);
        if (window.crypto && window.crypto.getRandomValues) {
          window.crypto.getRandomValues(bytes);
        } else {
          for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
        }
        return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
      }

      async function hashPassword(password, salt) {
        const payload = `pkfc:${salt}:${password}`;
        if (window.crypto && window.crypto.subtle) {
          const enc = new TextEncoder().encode(payload);
          const buf = await window.crypto.subtle.digest('SHA-256', enc);
          return Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, '0')).join('');
        }
        let h1 = 2166136261;
        let h2 = 3735928559;
        for (let i = 0; i < payload.length; i++) {
          const ch = payload.charCodeAt(i);
          h1 = Math.imul(h1 ^ ch, 16777619);
          h2 = Math.imul(h2 ^ (ch + i), 2654435761);
        }
        return `${(h1 >>> 0).toString(16).padStart(8, '0')}${(h2 >>> 0).toString(16).padStart(8, '0')}`;
      }

      function normalizeUsername(raw) {
        const display = (raw || '').trim();
        const key = display.toLowerCase();
        return { display, key };
      }

        if (!/^[a-z0-9_-]{3,18}$/.test(key)) {

        }
        if (!password || password.length < 4) {
          return 'Password must be at least 4 characters.';
        }
        return null;
      }

      function sanitizeSave(rawSave) {
        const merged = { ...DEFAULT_SAVE, ...(rawSave || {}) };
        if (Object.keys(CARD_BY_ID).length === 0) return merged;

        const cleanInv = {};
        Object.entries(merged.inventory || {}).forEach(([id, count]) => {
          if (CARD_BY_ID[id] && count > 0) cleanInv[id] = count;
        });

        let hasAnyOwned = Object.keys(cleanInv).length > 0;
        if (!hasAnyOwned) {
          Object.assign(cleanInv, DEFAULT_SAVE.inventory);
        }

        const usedInSquad = new Set();
        const cleanSquad = (Array.isArray(merged.squadIds) ? merged.squadIds : DEFAULT_SAVE.squadIds).map((id, idx) => {
          if (CARD_BY_ID[id] && (cleanInv[id] || 0) > 0 && !usedInSquad.has(id)) {
            usedInSquad.add(id);
            return id;
          }
          const defId = DEFAULT_SAVE.squadIds[idx];
          if (CARD_BY_ID[defId] && !usedInSquad.has(defId)) {
            cleanInv[defId] = cleanInv[defId] || 1;
            usedInSquad.add(defId);
            return defId;
          }
          const fallback = Object.keys(cleanInv).find((cid) => !usedInSquad.has(cid)) || PLAYER_POOL[0]?.id;
          if (fallback) {
            cleanInv[fallback] = cleanInv[fallback] || 1;
            usedInSquad.add(fallback);
          }
          return fallback;
        });

        const discSet = new Set(
          (Array.isArray(merged.discoveredIds) ? merged.discoveredIds : []).filter((id) => Boolean(CARD_BY_ID[id]))
        );
        Object.keys(cleanInv).forEach((id) => discSet.add(id));

        return {
          ...merged,
          inventory: cleanInv,
          squadIds: cleanSquad,
          discoveredIds: Array.from(discSet),
        };
      }

        try {

          if (!raw) return DEFAULT_SAVE;
          const parsed = JSON.parse(raw);
          return sanitizeSave(parsed);
        } catch {
          return DEFAULT_SAVE;
        }

          slots.forEach((slot, idx) => {
            if (slot.role === 'GK') {
              const gk = available.find((c) => !used.has(c.id) && c.pos === 'GK');
              if (gk) {
                used.add(gk.id);
                nextSquad[idx] = gk.id;

                              >
                                <span>DIVISION {d}</span>
                                <span>{active ? `YOU (${save.elo} ELO)` : d === 1 ? '1900+ ELO' : `${800 + (10 - d) * 110}+ ELO`}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      <div className="lg:col-span-7 pixel-panel p-5 flex flex-col gap-4">
                        <div className="flex items-center justify-between">
                          <h2 className="font-arcade text-sm text-amber-300">GLOBAL LEADERBOARD</h2>
                          <span className="text-xs text-slate-400">
                            {fbConnected ? 'FIREBASE LIVE SYNC' : 'LOCAL + RETRO RIVALS'}
                          </span>
                        </div>
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs tabular-nums">
                            <thead>
                              <tr className="border-b-2 border-slate-700 text-slate-400">
                                <th className="py-2 pr-2">#</th>
                                <th className="py-2 pr-2">CLUB</th>
                                <th className="py-2 pr-2">OVR</th>
                                <th className="py-2 pr-2">W-L</th>
                                <th className="py-2 text-right">ELO</th>
                              </tr>
                            </thead>
                            <tbody>
                              {combinedLeaderboard.map((row, idx) => (
                                <tr
                                  key={row.accountKey || `${row.clubName}-${idx}`}
                                  className={`border-b border-slate-800 ${
                                    row.isYou ? 'bg-emerald-500/15 text-emerald-300 font-bold' : 'text-slate-200'
                                  }`}
                                >
                                  <td className="py-2.5 pr-2">{idx + 1}</td>
                                  <td className="py-2.5 pr-2">
                                    <span>{row.clubName}</span>
                                    {row.username && (
                                      <span className="ml-2 text-[10px] text-slate-400">
                                        {row.username === 'CPU' ? 'CPU' : `@${row.username}`}
                                      </span>
                                    )}
                                  </td>
                                  <td className="py-2.5 pr-2">{row.ovr || 75}</td>
                                  <td className="py-2.5 pr-2">
                                    {row.wins || 0}-{row.losses || 0}
                                  </td>
                                  <td className="py-2.5 text-right text-amber-300">{row.elo}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}
                </>
              )}
            </main>

            {/* MODALS: WALKOUT, PAUSE, MATCH RESULT, ACCOUNT, FIREBASE */}
            {walkoutResult && (
              <WalkoutModal packResult={walkoutResult} onClaim={handleClaimPack} />
            )}

            {showAccountModal && (
              <AccountModal
                currentUser={currentUser}
                currentClubName={save.clubName}
                fbConnected={fbConnected}
                onLogin={handleLoginAccount}
                onRegister={handleRegisterAccount}
                onLogout={handleLogoutAccount}
                onUpdateClubName={handleUpdateClubName}
                onClose={() => setShowAccountModal(false)}
              />
            )}

            {matchPaused && activeMatch && !matchResultModal && (
              <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="Match Paused">
                <div className="pixel-panel max-w-sm w-full p-6 flex flex-col items-center gap-4 text-center">
                  <h2 className="font-arcade text-base text-amber-300">MATCH PAUSED</h2>
                  <p className="font-vt text-xl text-slate-300">
                    {activeMatch.homeName} vs {activeMatch.awayName}
                  </p>
                  <div className="flex flex-col w-full gap-2.5">
                    <button
                      type="button"
                      onClick={() => setMatchPaused(false)}
                      className="w-full py-2.5 bg-emerald-500 text-slate-950 font-arcade text-xs pixel-btn"
                    >
                      RESUME MATCH
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setMatchPaused(false);
                        setActiveMatch((m) => ({ ...m, seed: m.seed + 1 }));
                      }}
                      className="w-full py-2.5 bg-slate-700 text-white font-pixel text-xs pixel-btn"
                    >
                      RESTART MATCH
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setMatchPaused(false);
                        setActiveMatch(null);
                      }}
                      className="w-full py-2.5 bg-rose-600 text-white font-pixel text-xs pixel-btn"
                    >
                      QUIT TO HUB
                    </button>
                  </div>
                </div>
              </div>
            )}

            {matchResultModal && (
              <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="Full Time Match Result">
                <div className="pixel-panel max-w-md w-full p-6 flex flex-col items-center gap-4 text-center">
                  <h2 className="font-arcade text-lg text-amber-300">
                    {matchResultModal.won ? 'VICTORY!' : matchResultModal.draw ? 'FULL TIME DRAW' : 'DEFEAT'}
                  </h2>
                  <div className="px-6 py-3 bg-slate-950 border-2 border-emerald-400 font-arcade text-2xl text-white tabular-nums">
                    {matchResultModal.homeScore} - {matchResultModal.awayScore}
                  </div>
                  <div className="w-full grid grid-cols-3 gap-2 text-xs tabular-nums">
                    <div className="p-2 bg-slate-950 border border-slate-700">
                      <div className="text-slate-400">COINS</div>
                      <div className="text-amber-300 font-bold mt-1">+{matchResultModal.coinsEarned}</div>
                    </div>
                    <div className="p-2 bg-slate-950 border border-slate-700">
                      <div className="text-slate-400">ELO</div>
                      <div className="text-emerald-400 font-bold mt-1">
                        {matchResultModal.eloDelta >= 0 ? `+${matchResultModal.eloDelta}` : matchResultModal.eloDelta}
                      </div>
                    </div>
                    <div className="p-2 bg-slate-950 border border-slate-700">
                      <div className="text-slate-400">POSS</div>
                      <div className="text-sky-400 font-bold mt-1">{matchResultModal.homePoss}%</div>
                    </div>
                  </div>
                  <div className="flex gap-3 w-full pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        setMatchResultModal(null);
                        setActiveMatch((m) => (m ? { ...m, seed: m.seed + 1 } : null));
                      }}
                      className="flex-1 py-2.5 bg-emerald-500 text-slate-950 font-arcade text-[10px] pixel-btn"
                    >
                      PLAY AGAIN
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setMatchResultModal(null);
                        setActiveMatch(null);
                      }}
                      className="flex-1 py-2.5 bg-slate-700 text-white font-arcade text-[10px] pixel-btn"
                    >
                      CLUBHOUSE
                    </button>
                  </div>
                </div>
              </div>
            )}

            {showFbModal && (
              <FirebaseConfigModal
                currentConfig={fbConfig}
                connected={fbConnected}
                fbError={fbError}
                onSave={(cfg) => {
                  localStorage.setItem(FB_STORAGE_KEY, JSON.stringify(cfg));
                  setFbConfig(cfg);
                  setShowFbModal(false);
                }}
                onUseOffline={() => {
                  localStorage.setItem(FB_STORAGE_KEY, JSON.stringify('OFFLINE'));
                  setFbConfig(null);
                  setShowFbModal(false);
                }}
                onClose={() => setShowFbModal(false)}
              />
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
    <script>
      (function () {
        var src = document.getElementById('pixel-kick-source').textContent;
        var compiled = window.Babel.transform(src, {
          presets: [['react', { runtime: 'classic' }]],
        }).code;
        var s = document.createElement('script');
        s.textContent = compiled;
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
