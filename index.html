                    <FlagSVG code={bestCard.nation} className="w-36 h-24 shadow-2xl" />
                    <span className="font-arcade text-lg text-white">{NATIONS[bestCard.nation]?.name}</span>
                  </div>
                )}

                {stage === 2 && (
                  <div className="animate-card-slam flex flex-col items-center gap-3">
                    <div className="px-8 py-5 bg-slate-900 border-4 border-emerald-400 font-arcade text-4xl text-emerald-300">
                      {bestCard.pos}
                    </div>
                    <span className="text-sm text-slate-300">{tierInfo.label}</span>
                  </div>
                )}

                {stage === 3 && (
                  <div className="animate-card-slam flex flex-col items-center gap-3">
                    <ClubCrestSVG club={bestCard.club} className="w-28 h-28" />
                    <span className="font-arcade text-base text-amber-300">{bestCard.club}</span>
                  </div>
                )}

                <button
                  type="button"
                  onClick={() => {
                    audioFX.playClick();
                    setStage(4);
                  }}
                  className="mt-6 px-4 py-2 text-xs bg-slate-800 border border-slate-600 text-slate-300 hover:text-white pixel-btn"
                >
                  SKIP REVEAL
                </button>
              </div>
            )}

            {stage === 4 && (
              <div className="relative z-10 flex flex-col items-center gap-5 max-w-3xl w-full">
                <div className="text-center">
                  <div className="font-arcade text-base sm:text-xl text-amber-300 crt-aberration">
                    {isWalkout ? 'WALKOUT STAR UNLOCKED!' : 'PACK CONTENTS'}
                  </div>
                  <div className="font-vt text-xl text-slate-300 mt-1">
                    {bestCard.name} · {bestCard.ovr} OVR · {tierInfo.label}
                  </div>
                </div>

                <div className="flex flex-wrap items-center justify-center gap-4 animate-card-slam">
                  {cards.map((c, idx) => (
                    <PlayerCardView key={`${c.id}-${idx}`} card={c} size={idx === 0 ? 'lg' : 'md'} />
                  ))}
                </div>

                <button
                  type="button"
                  onClick={() => {
                    audioFX.playClick();
                    onClaim();
                  }}
                  className="px-6 py-3 bg-emerald-500 text-slate-950 font-arcade text-xs pixel-btn"
                >
                  SEND ALL TO CLUB
                </button>
              </div>
            )}
          </div>
        );
      }

      /* =========================================================================
         7. LIVE 2D PITCH ENGINE (<canvas> 22-DOT SIMULATION)
      ========================================================================= */
      function buildMatchDots(homeSquad, homeFormation, awaySquad, awayFormation, awayBoost = 0) {
        const PITCH_W = 1280;
        const PITCH_H = 760;
        const PAD_X = 36;
        const PAD_Y = 30;
        const hSlots = FORMATIONS[homeFormation] || FORMATIONS['4-3-3'];
        const aSlots = FORMATIONS[awayFormation] || FORMATIONS['4-3-3'];
        const dots = [];
        const boost = Number(awayBoost) || 0;
        const capStat = (v) => Math.max(40, Math.min(99, Math.round(v)));

        for (let i = 0; i < 11; i++) {
          const hc = homeSquad[i] || PLAYER_POOL[i];
          const hs = hSlots[i];
          const hx = PAD_X + 20 + hs.x * (PITCH_W - PAD_X * 2 - 40);
          const hy = PAD_Y + 18 + hs.y * (PITCH_H - PAD_Y * 2 - 36);
          const hKoX = hs.role === 'GK' ? PAD_X + 20 : Math.min(PITCH_W / 2 - 28, PAD_X + 24 + hs.x * (PITCH_W * 0.44));
          dots.push({
            id: `h-${i}`,
            team: 'home',
            slotIndex: i,
            shirtNum: hc.shirtNum || i + 1,
            name: hc.name,
            pos: hs.pos,
            role: hs.role,
            traits: getPlayerTraits(hc),
            x: hKoX,
            y: hy,
            vx: 0,
            vy: 0,
            homeX: hx,
            homeY: hy,
            kickoffX: hKoX,
            kickoffY: hy,
            pac: hc.stats.pac,
            sho: hc.stats.sho,
            pas: hc.stats.pas,
            dri: hc.stats.dri,
            def: hc.stats.def,
            phy: hc.stats.phy || 70,
            redCarded: false,
            yellowCards: 0,
            diveTimer: 0,
            diveVy: 0,
            dribbleCD: 0,
          });

          const ac = awaySquad[i] || PLAYER_POOL[(i + 12) % PLAYER_POOL.length];
          const as = aSlots[i];
          const ax = PITCH_W - (PAD_X + 20 + as.x * (PITCH_W - PAD_X * 2 - 40));
          const ay = PAD_Y + 18 + (1 - as.y) * (PITCH_H - PAD_Y * 2 - 36);
          const aKoX = as.role === 'GK' ? PITCH_W - PAD_X - 20 : Math.max(PITCH_W / 2 + 28, PITCH_W - PAD_X - 24 - as.x * (PITCH_W * 0.44));
          dots.push({
            id: `a-${i}`,
            team: 'away',
            slotIndex: i,
            shirtNum: ac.shirtNum || i + 1,
            name: ac.name,
            pos: as.pos,
            role: as.role,
            traits: getPlayerTraits(ac),
            x: aKoX,
            y: ay,
            vx: 0,
            vy: 0,
            homeX: ax,
            homeY: ay,
            kickoffX: aKoX,
            kickoffY: ay,
            pac: capStat(ac.stats.pac + boost),
            sho: capStat(ac.stats.sho + boost),
            pas: capStat(ac.stats.pas + boost),
            dri: capStat(ac.stats.dri + boost),
            def: capStat(ac.stats.def + boost),
            phy: capStat((ac.stats.phy || 70) + boost),
            redCarded: false,
            yellowCards: 0,
            diveTimer: 0,
            diveVy: 0,
            dribbleCD: 0,
          });
        }
        return dots;
      }

      function distPointToSeg2D(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const lenSq = dx * dx + dy * dy;
        if (lenSq < 1e-6) return Math.hypot(px - x1, py - y1);
        const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / lenSq));
        return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
      }

      function PitchCanvas({
        homeName,
        awayName,
        homeSquad,
        awaySquad,
        homeFormation = '4-3-3',
        awayFormation = '4-3-3',
        homeTactics = DEFAULT_TACTICS,
        awayTactics = DEFAULT_TACTICS,
        awayBoost = 0,
        awayKit = '#ef4444',
        seed = 1337,
        paused = false,
        ambientOnly = false,
        roomSyncRef = null,
        onMatchEnd,
        onPauseToggle,
        onOpenTactics,
      }) {
        const canvasRef = useRef(null);
        const simRef = useRef(null);
        const speedRef = useRef(1);
        const pausedRef = useRef(paused);
        pausedRef.current = paused;
        const loopKickRef = useRef(null);
        const homeTacRef = useRef(homeTactics || DEFAULT_TACTICS);
        const awayTacRef = useRef(awayTactics || DEFAULT_TACTICS);
        homeTacRef.current = homeTactics || DEFAULT_TACTICS;
        awayTacRef.current = awayTactics || DEFAULT_TACTICS;

        const [speed, setSpeed] = useState(1);
        const [hud, setHud] = useState({
          minute: 0,
          homeScore: 0,
          awayScore: 0,
          homeShots: 0,
          awayShots: 0,
          homePasses: 0,
          awayPasses: 0,
          homeCrosses: 0,
          awayCrosses: 0,
          homeDribbles: 0,
          awayDribbles: 0,
          homePoss: 50,
          commentary: 'Kickoff! The stadium floodlights are blazing!',
        });
        const [tickerLog, setTickerLog] = useState(['00\' Kickoff! Both squads take their positions.']);
        const onMatchEndRef = useRef(onMatchEnd);
        onMatchEndRef.current = onMatchEnd;

        useEffect(() => {
          speedRef.current = speed;
        }, [speed]);

        useEffect(() => {
          const PITCH_W = 1280;
          const PITCH_H = 760;
          const PAD_X = 36;
          const PAD_Y = 30;
          const rng = createSeededRng(seed);
          const dots = buildMatchDots(homeSquad, homeFormation, awaySquad, awayFormation, awayBoost);

          // Pre-render static pitch turf & markings to an offscreen canvas (eliminates per-frame turf fill overhead)
          const pitchBgCanvas = document.createElement('canvas');
          pitchBgCanvas.width = PITCH_W;
          pitchBgCanvas.height = PITCH_H;
          const bgCtx = pitchBgCanvas.getContext('2d');
          if (bgCtx) {
            const stripeCount = 16;
            const stripeW = PITCH_W / stripeCount;
            for (let i = 0; i < stripeCount; i++) {
              bgCtx.fillStyle = i % 2 === 0 ? '#0b4728' : '#0e5732';
              bgCtx.fillRect(i * stripeW, 0, stripeW + 1, PITCH_H);
            }
            bgCtx.strokeStyle = '#6ee7b7';
            bgCtx.lineWidth = 2.5;
            bgCtx.strokeRect(PAD_X, PAD_Y, PITCH_W - PAD_X * 2, PITCH_H - PAD_Y * 2);
            bgCtx.beginPath();
            bgCtx.moveTo(PITCH_W / 2, PAD_Y);
            bgCtx.lineTo(PITCH_W / 2, PITCH_H - PAD_Y);
            bgCtx.stroke();
            bgCtx.beginPath();
            bgCtx.arc(PITCH_W / 2, PITCH_H / 2, 86, 0, Math.PI * 2);
            bgCtx.stroke();
            bgCtx.fillStyle = '#6ee7b7';
            bgCtx.beginPath();
            bgCtx.arc(PITCH_W / 2, PITCH_H / 2, 4, 0, Math.PI * 2);
            bgCtx.fill();
            const boxW = 168;
            const boxH = PITCH_H * 0.54;
            const sixW = 62;
            const sixH = PITCH_H * 0.26;
            bgCtx.strokeRect(PAD_X, (PITCH_H - boxH) / 2, boxW, boxH);
            bgCtx.strokeRect(PAD_X, (PITCH_H - sixH) / 2, sixW, sixH);
            bgCtx.strokeRect(PITCH_W - PAD_X - boxW, (PITCH_H - boxH) / 2, boxW, boxH);
            bgCtx.strokeRect(PITCH_W - PAD_X - sixW, (PITCH_H - sixH) / 2, sixW, sixH);
            bgCtx.fillRect(PAD_X + 118, PITCH_H / 2 - 2, 4, 4);
            bgCtx.fillRect(PITCH_W - PAD_X - 122, PITCH_H / 2 - 2, 4, 4);
            bgCtx.beginPath();
            bgCtx.arc(PAD_X + 120, PITCH_H / 2, 74, -0.68, 0.68);
            bgCtx.stroke();
            bgCtx.beginPath();
            bgCtx.arc(PITCH_W - PAD_X - 120, PITCH_H / 2, 74, Math.PI - 0.68, Math.PI + 0.68);
            bgCtx.stroke();
          }

          const state = {
            pitchW: PITCH_W,
            pitchH: PITCH_H,
            dots,
            ball: {
              x: PITCH_W / 2,
              y: PITCH_H / 2,
              z: 0,
              vx: 0,
              vy: 0,
              vz: 0,
              ownerId: null,
              lastTouchTeam: 'home',
              kickCooldown: 0.15,
            },
            homeScore: 0,
            awayScore: 0,
            homeShots: 0,
            awayShots: 0,
            homePasses: 0,
            awayPasses: 0,
            homeCrosses: 0,
            awayCrosses: 0,
            homeDribbles: 0,
            awayDribbles: 0,
            homePossTicks: 1,
            awayPossTicks: 1,
            elapsedMinutes: 0,
            freezeTicks: 0,
            goalBannerTimer: 0,
            netRippleTimer: 0,
            flagPhase: 0,
            lastPassLine: null,
            passLineTimer: 0,
            kickoffTimer: 0.55,
            carryTime: 0,
            passTargetId: null,
            shotInFlight: null,
            gkHoldTimer: 0,
            finished: false,
          };
          simRef.current = state;

          if (!ambientOnly) {
            audioFX.playWhistle('short');
          }

          let animId = 0;
          let lastTime = performance.now();
          let lastAmbientDraw = 0;
          let hudSyncAccum = 0;
          let lastCommentary = 'Kickoff! Both sides keeping shape in midfield.';
          let lastHudSig = '';

          const pushComment = (min, text) => {
            const line = `${String(Math.min(90, Math.floor(min))).padStart(2, '0')}' ${text}`;
            lastCommentary = line;
            setTickerLog((prev) => [line, ...prev].slice(0, 8));
          };

          const resetKO = (kickingTeam = 'home') => {
            state.ball.x = PITCH_W / 2;
            state.ball.y = PITCH_H / 2;
            state.ball.z = 0;
            state.ball.vx = 0;
            state.ball.vy = 0;
            state.ball.vz = 0;
            state.ball.ownerId = null;
            state.ball.kickCooldown = 0.22;
            state.kickoffTimer = 0.55;
            state.carryTime = 0;
            state.passTargetId = null;
            state.shotInFlight = null;
            state.gkHoldTimer = 0;
            let taker = null;
            state.dots.forEach((d) => {
              d.x = d.kickoffX;
              d.y = d.kickoffY;
              d.vx = 0;
              d.vy = 0;
              d.diveTimer = 0;
              d.dribbleCD = 0;
              if (!d.redCarded && d.team === kickingTeam && d.role === 'FWD') {
                taker = d;
              }
            });
            if (!taker) {
              taker = state.dots.find((d) => !d.redCarded && d.team === kickingTeam && d.role !== 'GK');
            }
            if (taker) {
              taker.x = PITCH_W / 2 + (kickingTeam === 'home' ? -8 : 8);
              taker.y = PITCH_H / 2;
              state.ball.ownerId = taker.id;
              state.ball.lastTouchTeam = kickingTeam;
            }
          };

          resetKO('home');

          const stepSim = (dt) => {
            state.flagPhase += dt * 5;
            if (state.netRippleTimer > 0) state.netRippleTimer = Math.max(0, state.netRippleTimer - dt);
            if (state.passLineTimer > 0) state.passLineTimer = Math.max(0, state.passLineTimer - dt);
            if (state.goalBannerTimer > 0) state.goalBannerTimer = Math.max(0, state.goalBannerTimer - dt);
            if (state.kickoffTimer > 0) state.kickoffTimer = Math.max(0, state.kickoffTimer - dt);
            if (state.gkHoldTimer > 0) state.gkHoldTimer = Math.max(0, state.gkHoldTimer - dt);

            if (state.freezeTicks > 0) {
              state.freezeTicks -= 1;
              return;
            }

            if (!ambientOnly) {
              // 90 mins in ~48 seconds at 1x speed
              state.elapsedMinutes += dt * 1.85;
              if (state.elapsedMinutes >= 90 && !state.finished) {
                state.finished = true;
                audioFX.playWhistle('fulltime');
                pushComment(90, `FULL TIME! ${homeName} ${state.homeScore} - ${state.awayScore} ${awayName}`);
                if (onMatchEndRef.current) {
                  const totalP = state.homePossTicks + state.awayPossTicks;
                  onMatchEndRef.current({
                    homeScore: state.homeScore,
                    awayScore: state.awayScore,
                    homeShots: state.homeShots,
                    awayShots: state.awayShots,
                    homePasses: state.homePasses,
                    awayPasses: state.awayPasses,
                    homeCrosses: state.homeCrosses,
                    awayCrosses: state.awayCrosses,
                    homeDribbles: state.homeDribbles,
                    awayDribbles: state.awayDribbles,
                    homePoss: Math.round((state.homePossTicks / totalP) * 100),
                  });
                }
                return;
              }
            }

            const { ball } = state;
            if (ball.kickCooldown > 0) ball.kickCooldown = Math.max(0, ball.kickCooldown - dt);

            const prevX = ball.x;
            const prevY = ball.y;

            if (!ball.ownerId) {
              ball.x += ball.vx * dt;
              ball.y += ball.vy * dt;
              ball.z = Math.max(0, ball.z + ball.vz * dt);
              if (ball.z > 0) {
                ball.vz -= 460 * dt;
                if (ball.z <= 0) {
                  ball.z = 0;
                  ball.vz = Math.abs(ball.vz) > 45 ? -ball.vz * 0.35 : 0;
                }
              }
              const friction = ball.z > 2 ? 0.992 : 0.974;
              ball.vx *= Math.pow(friction, dt * 60);
              ball.vy *= Math.pow(friction, dt * 60);
              if (Math.hypot(ball.vx, ball.vy) < 40) {
                state.shotInFlight = null;
              }
            }

            const goalTop = PITCH_H * 0.415;
            const goalBot = PITCH_H * 0.585;

            // Swept GK save check BEFORE goal line check
            if (!ball.ownerId && ball.kickCooldown <= 0 && ball.z < 52) {
              for (const gk of state.dots) {
                if (gk.redCarded || gk.role !== 'GK') continue;
                const gkReach = 22 + (gk.def / 100) * 14;
                const segDist = distPointToSeg2D(gk.x, gk.y, prevX, prevY, ball.x, ball.y);
                if (segDist < gkReach) {
                  const isShot = Boolean(state.shotInFlight && state.shotInFlight.team !== gk.team);
                  const speed = Math.hypot(ball.vx, ball.vy);
                  if (isShot || speed > 220) {
                    const catchChance = 0.52 + (gk.def / 100) * 0.25 - Math.min(0.25, speed / 2600);
                    if (rng() < catchChance) {
                      ball.ownerId = gk.id;
                      ball.lastTouchTeam = gk.team;
                      ball.x = gk.x;
                      ball.y = gk.y;
                      ball.vx = 0;
                      ball.vy = 0;
                      ball.vz = 0;
                      ball.z = 0;
                      ball.kickCooldown = 0.22;
                      state.gkHoldTimer = 0.45;
                      state.shotInFlight = null;
                      state.passTargetId = null;
                      if (!ambientOnly) {
                        audioFX.playKick(0.95);
                        pushComment(state.elapsedMinutes, `Clean catch by ${gk.name}!`);
                      }
                    } else {
                      const clearDir = gk.team === 'home' ? 1 : -1;
                      const sideSign = ball.y >= PITCH_H / 2 ? 1 : -1;
                      ball.ownerId = null;
                      ball.lastTouchTeam = gk.team;
                      ball.x = gk.x + clearDir * 10;
                      ball.vx = clearDir * (170 + rng() * 110);
                      ball.vy = sideSign * (210 + rng() * 140);
                      ball.vz = 65;
                      ball.kickCooldown = 0.28;
                      gk.diveTimer = 0.36;
                      gk.diveVy = (ball.y - gk.y) * 2.2;
                      state.shotInFlight = null;
                      state.passTargetId = null;
                      if (!ambientOnly) {
                        audioFX.playKick(1.1);
                        pushComment(state.elapsedMinutes, `Fingertip parry by ${gk.name}!`);
                      }
                    }
                    break;
                  }
                }
              }
            }

            const inGoalMouthY = ball.y >= goalTop && ball.y <= goalBot;

            // Goal or Endline Restart
            if (!ball.ownerId && ball.x <= PAD_X) {
              if (inGoalMouthY && ball.z < 50) {
                state.awayScore += 1;
                state.goalBannerTimer = 1.9;
                state.netRippleTimer = 1.6;
                state.freezeTicks = 32;
                if (!ambientOnly) {
                  audioFX.playGoalRoar();
                  pushComment(state.elapsedMinutes, `GOAL! ${awayName} finish past the keeper!`);
                }
                resetKO('home');
                return;
              }
              state.shotInFlight = null;
              state.passTargetId = null;
              if (Math.abs(ball.y - goalTop) < 12 || Math.abs(ball.y - goalBot) < 12) {
                if (!ambientOnly) {
                  audioFX.playPostClang();
                  pushComment(state.elapsedMinutes, 'CLANG! Off the woodwork!!');
                }
              }
              if (ball.lastTouchTeam === 'home') {
                ball.x = PAD_X + 14;
                ball.y = ball.y < PITCH_H / 2 ? PAD_Y + 14 : PITCH_H - PAD_Y - 14;
                ball.z = 0;
                ball.vx = 0;
                ball.vy = 0;
                ball.vz = 0;
                ball.kickCooldown = 0.25;
                const taker = state.dots.find((d) => d.team === 'away' && !d.redCarded && d.role === 'FWD')
                  || state.dots.find((d) => d.team === 'away' && !d.redCarded && d.role !== 'GK');
                if (taker) {
                  taker.x = ball.x;
                  taker.y = ball.y;
                  ball.ownerId = taker.id;
                  ball.lastTouchTeam = 'away';
                  state.carryTime = 0.2;
                }
                if (!ambientOnly) pushComment(state.elapsedMinutes, `Corner kick to ${awayName}.`);
              } else {
                const gk = state.dots.find((d) => d.team === 'home' && d.role === 'GK');
                ball.x = PAD_X + 34;
                ball.y = PITCH_H * 0.5;
                ball.z = 0;
                ball.vx = 0;
                ball.vy = 0;
                ball.vz = 0;
                ball.kickCooldown = 0.25;
                if (gk) {
                  gk.x = ball.x;
                  gk.y = ball.y;
                  ball.ownerId = gk.id;
                  ball.lastTouchTeam = 'home';
                  state.gkHoldTimer = 0.35;
                }
                if (!ambientOnly) pushComment(state.elapsedMinutes, `Wide! Goal kick for ${homeName}.`);
              }
            } else if (!ball.ownerId && ball.x >= PITCH_W - PAD_X) {
              if (inGoalMouthY && ball.z < 50) {
                state.homeScore += 1;
                state.goalBannerTimer = 1.9;
                state.netRippleTimer = 1.6;
                state.freezeTicks = 32;
                if (!ambientOnly) {
                  audioFX.playGoalRoar();
                  pushComment(state.elapsedMinutes, `GOOOAL!! ${homeName} fire it into the net!`);
                }
                resetKO('away');
                return;
              }
              state.shotInFlight = null;
              state.passTargetId = null;
              if (Math.abs(ball.y - goalTop) < 12 || Math.abs(ball.y - goalBot) < 12) {
                if (!ambientOnly) {
                  audioFX.playPostClang();
                  pushComment(state.elapsedMinutes, 'WOODWORK! Inches away from glory!');
                }
              }
              if (ball.lastTouchTeam === 'away') {
                ball.x = PITCH_W - PAD_X - 14;
                ball.y = ball.y < PITCH_H / 2 ? PAD_Y + 14 : PITCH_H - PAD_Y - 14;
                ball.z = 0;
                ball.vx = 0;
                ball.vy = 0;
                ball.vz = 0;
                ball.kickCooldown = 0.25;
                const taker = state.dots.find((d) => d.team === 'home' && !d.redCarded && d.role === 'FWD')
                  || state.dots.find((d) => d.team === 'home' && !d.redCarded && d.role !== 'GK');
                if (taker) {
                  taker.x = ball.x;
                  taker.y = ball.y;
                  ball.ownerId = taker.id;
                  ball.lastTouchTeam = 'home';
                  state.carryTime = 0.2;
                }
                if (!ambientOnly) pushComment(state.elapsedMinutes, `Corner kick to ${homeName}!`);
              } else {
                const gk = state.dots.find((d) => d.team === 'away' && d.role === 'GK');
                ball.x = PITCH_W - PAD_X - 34;
                ball.y = PITCH_H * 0.5;
                ball.z = 0;
                ball.vx = 0;
                ball.vy = 0;
                ball.vz = 0;
                ball.kickCooldown = 0.25;
                if (gk) {
                  gk.x = ball.x;
                  gk.y = ball.y;
                  ball.ownerId = gk.id;
                  ball.lastTouchTeam = 'away';
                  state.gkHoldTimer = 0.35;
                }
                if (!ambientOnly) pushComment(state.elapsedMinutes, `Wide! Goal kick for ${awayName}.`);
              }
            }

            // Sideline Throw-in
            if (!ball.ownerId && (ball.y <= PAD_Y || ball.y >= PITCH_H - PAD_Y)) {
              state.shotInFlight = null;
              state.passTargetId = null;
              const clampY = ball.y <= PAD_Y ? PAD_Y + 8 : PITCH_H - PAD_Y - 8;
              const clampX = Math.max(PAD_X + 20, Math.min(PITCH_W - PAD_X - 20, ball.x));
              const throwTeam = ball.lastTouchTeam === 'home' ? 'away' : 'home';
              let taker = null;
              let bestD = Infinity;
              for (const d of state.dots) {
                if (d.redCarded || d.role === 'GK' || d.team !== throwTeam) continue;
                const dist = Math.hypot(d.x - clampX, d.y - clampY);
                if (dist < bestD) {
                  bestD = dist;
                  taker = d;
                }
              }
              ball.x = clampX;
              ball.y = clampY;
              ball.z = 0;
              ball.vx = 0;
              ball.vy = 0;
              ball.vz = 0;
              ball.kickCooldown = 0.25;
              if (taker) {
                taker.x = clampX;
                taker.y = clampY;
                ball.ownerId = taker.id;
                ball.lastTouchTeam = throwTeam;
                state.carryTime = 0.2;
              }
            }

            if (ball.lastTouchTeam === 'home') state.homePossTicks += 1;
            else if (ball.lastTouchTeam === 'away') state.awayPossTicks += 1;
            if (ball.ownerId) state.carryTime += dt;
            else state.carryTime = 0;

            let nearestHome = null;
            let nearestHomeDist = Infinity;
            let nearestAway = null;
            let nearestAwayDist = Infinity;
            const homeXs = [];
            const awayXs = [];

            for (const d of state.dots) {
              if (d.redCarded) continue;
              if (d.team === 'home') homeXs.push(d.x);
              else awayXs.push(d.x);
              if (d.role === 'GK') continue;
              const dist = Math.hypot(ball.x - d.x, ball.y - d.y);
              if (d.team === 'home' && dist < nearestHomeDist) {
                nearestHomeDist = dist;
                nearestHome = d;
              }
              if (d.team === 'away' && dist < nearestAwayDist) {
                nearestAwayDist = dist;
                nearestAway = d;
              }
            }
            homeXs.sort((a, b) => a - b);
            awayXs.sort((a, b) => b - a);
            const homeBackLineX = homeXs[1] ?? PAD_X + 120;
            const awayBackLineX = awayXs[1] ?? PITCH_W - PAD_X - 120;

            const homeTac = homeTacRef.current || DEFAULT_TACTICS;
            const awayTac = awayTacRef.current || DEFAULT_TACTICS;
            const ballRatioX = ball.x / PITCH_W;
            const ownerDot = ball.ownerId ? state.dots.find((d) => d.id === ball.ownerId) : null;
            const possessingTeam = ownerDot ? ownerDot.team : ball.lastTouchTeam;

            for (const dot of state.dots) {
              if (dot.redCarded) continue;

              if (dot.diveTimer > 0) {
                dot.diveTimer = Math.max(0, dot.diveTimer - dt);
                dot.y = Math.max(goalTop - 6, Math.min(goalBot + 6, dot.y + dot.diveVy * dt));
                continue;
              }
              if (dot.dribbleCD > 0) {
                dot.dribbleCD = Math.max(0, dot.dribbleCD - dt);
              }

              const tac = dot.team === 'home' ? homeTac : awayTac;
              const isOwner = ball.ownerId === dot.id;
              const speedBase = (86 + dot.pac * 1.12) * (dot === nearestHome || dot === nearestAway ? 0.96 + (tac.aggressiveness / 100) * 0.14 : 1);
              const pos = dot.pos || dot.role;
              const traits = dot.traits || [];
              let targetX = dot.homeX;
              let targetY = dot.homeY;

              if (dot.role === 'GK') {
                const baseX = dot.team === 'home' ? PAD_X + 20 : PITCH_W - PAD_X - 20;
                const sweeperRange = traits.includes('Sweeper Keeper') ? 32 : 16;
                const stepOut = dot.team === 'home'
                  ? (ball.x < PITCH_W * 0.25 ? sweeperRange : 0)
                  : (ball.x > PITCH_W * 0.75 ? -sweeperRange : 0);
                targetX = isOwner ? baseX : baseX + stepOut;
                targetY = Math.max(goalTop + 10, Math.min(goalBot - 10, ball.y));
              } else if (isOwner) {
                const attackDir = dot.team === 'home' ? 1 : -1;
                const isWideRole = pos === 'LW' || pos === 'RW' || pos === 'LM' || pos === 'RM' || pos === 'LB' || pos === 'RB';
                const goalX = dot.team === 'home' ? PITCH_W - PAD_X : PAD_X;
                const distGoal = Math.hypot(goalX - dot.x, PITCH_H * 0.5 - dot.y);
                let repelX = 0;
                let repelY = 0;
                let evaded = false;

                for (const opp of state.dots) {
                  if (opp.team === dot.team || opp.redCarded) continue;
                  const od = Math.hypot(dot.x - opp.x, dot.y - opp.y);
                  if (od < 76 && od > 1) {
                    const evadeBoost = (0.75 + (dot.dri / 100) * 0.65) * (0.7 + (tac.dribbleTendency / 100) * 0.65);
                    repelX += ((dot.x - opp.x) / od) * ((76 - od) / 76) * 78 * evadeBoost;
                    repelY += ((dot.y - opp.y) / od) * ((76 - od) / 76) * 105 * evadeBoost;
                    if (od < 34 && dot.dribbleCD <= 0 && rng() < (0.04 + (dot.dri / 100) * 0.05) * (0.6 + tac.dribbleTendency / 100)) {
                      evaded = true;
                    }
                  }
                }
                if (evaded) {
                  dot.dribbleCD = 0.75;
                  if (dot.team === 'home') state.homeDribbles += 1;
                  else state.awayDribbles += 1;
                  if (!ambientOnly && rng() < 0.35) {
                    pushComment(state.elapsedMinutes, `${dot.name} dances past the marker!`);
                  }
                }

                const preferFlank = isWideRole && distGoal > PITCH_W * 0.17 && tac.crossIntensity >= 45;
                const desiredY = preferFlank
                  ? (dot.y < PITCH_H * 0.5 ? PAD_Y + 62 : PITCH_H - PAD_Y - 62)
                  : PITCH_H * 0.5;
                targetX = Math.max(PAD_X + 20, Math.min(PITCH_W - PAD_X - 20, dot.x + attackDir * 140 + repelX));
                targetY = Math.max(PAD_Y + 22, Math.min(PITCH_H - PAD_Y - 22, dot.y + (desiredY - dot.y) * 0.28 + repelY));
              } else if (state.passTargetId === dot.id && !ball.ownerId) {
                targetX = ball.x + ball.vx * 0.16;
                targetY = ball.y + ball.vy * 0.16;
              } else if (dot === nearestHome || dot === nearestAway) {
                targetX = ball.x;
                targetY = ball.y;
              } else {
                const teamAttacking = possessingTeam === dot.team;
                const attackDir = dot.team === 'home' ? 1 : -1;
                const lineBias = ((tac.positioningLine - 50) / 100) * PITCH_W * 0.18 * attackDir;
                const freedom = 0.28 + (tac.positioningFreedom / 100) * 0.45;
                const phaseBias = teamAttacking ? attackDir * PITCH_W * 0.075 : -attackDir * PITCH_W * 0.085;
                const shiftX = (ballRatioX - 0.5) * PITCH_W * (0.32 + freedom * 0.22) + phaseBias + lineBias;
                targetX = dot.homeX + shiftX;
                targetY = dot.homeY + (ball.y - PITCH_H * 0.5) * (0.18 + freedom * 0.2);

                if (teamAttacking) {
                  if (pos === 'ST') {
                    targetX += attackDir * (65 + tac.positioningFreedom * 0.4);
                    targetY += (PITCH_H * 0.5 - targetY) * 0.28;
                  } else if (pos === 'LW' || pos === 'LM') {
                    targetX += attackDir * 58;
                    targetY = Math.min(targetY, PITCH_H * 0.24);
                  } else if (pos === 'RW' || pos === 'RM') {
                    targetX += attackDir * 58;
                    targetY = Math.max(targetY, PITCH_H * 0.76);
                  } else if ((pos === 'LB' || pos === 'RB') && (tac.positioningFreedom > 55 || tac.crossIntensity > 60)) {
                    targetX += attackDir * 85;
                  } else if (pos === 'CAM') {
                    targetX += attackDir * 42;
                  }
                  if (dot.role === 'FWD') {
                    if (dot.team === 'home') targetX = Math.min(targetX, awayBackLineX - 6);
                    else targetX = Math.max(targetX, homeBackLineX + 6);
                  }
                } else {
                  if ((dot.role === 'DEF' || pos === 'CDM') && tac.manMarking >= 35) {
                    let markOpp = null;
                    let markDist = 175 + tac.manMarking * 1.4;
                    for (const opp of state.dots) {
                      if (opp.team === dot.team || opp.redCarded || opp.role === 'GK') continue;
                      const d = Math.hypot(opp.x - dot.x, opp.y - dot.y);
                      if (d < markDist) {
                        markDist = d;
                        markOpp = opp;
                      }
                    }
                    if (markOpp) {
                      const w = (tac.manMarking / 100) * 0.68;
                      const goalSideX = markOpp.x - attackDir * 16;
                      targetX = targetX * (1 - w) + goalSideX * w;
                      targetY = targetY * (1 - w) + markOpp.y * w;
                    }
                  }
                  if (dot.role === 'DEF') {
                    const ownGoalX = dot.team === 'home' ? PAD_X + 55 : PITCH_W - PAD_X - 55;
                    const deepPull = Math.max(0.15, 0.48 - (tac.positioningLine / 100) * 0.28);
                    targetX = ownGoalX * deepPull + targetX * (1 - deepPull);
                  }
                }

                targetX = Math.max(PAD_X + 28, Math.min(PITCH_W - PAD_X - 28, targetX));
                targetY = Math.max(PAD_Y + 24, Math.min(PITCH_H - PAD_Y - 24, targetY));
              }

              const dx = targetX - dot.x;
              const dy = targetY - dot.y;
              const dist = Math.hypot(dx, dy);

              if (dist > 3) {
                const turnRate = 0.1 + (dot.dri / 100) * 0.14;
                const desiredVx = (dx / dist) * speedBase;
                const desiredVy = (dy / dist) * speedBase;
                dot.vx += (desiredVx - dot.vx) * turnRate;
                dot.vy += (desiredVy - dot.vy) * turnRate;
                dot.x = Math.max(PAD_X + 10, Math.min(PITCH_W - PAD_X - 10, dot.x + dot.vx * dt));
                dot.y = Math.max(PAD_Y + 10, Math.min(PITCH_H - PAD_Y - 10, dot.y + dot.vy * dt));
              }

              // Outfield pickup, interception, tackle, or shot block
              if (dot.role !== 'GK' && ball.kickCooldown <= 0 && ball.z < 26) {
                const segDist = distPointToSeg2D(dot.x, dot.y, prevX, prevY, ball.x, ball.y);
                const aggFactor = tac.aggressiveness / 100;
                const reach = 11.5 + (dot.def > 78 ? 2.5 : 0) + aggFactor * 2.5;
                if (segDist < reach) {
                  if (state.shotInFlight && state.shotInFlight.team !== dot.team && !ball.ownerId) {
                    ball.vx = (dot.team === 'home' ? 1 : -1) * (110 + rng() * 90);
                    ball.vy = (rng() - 0.5) * 180;
                    ball.vz = 25;
                    ball.lastTouchTeam = dot.team;
                    ball.kickCooldown = 0.25;
                    state.shotInFlight = null;
                    if (!ambientOnly) {
                      audioFX.playKick(0.85);
                      pushComment(state.elapsedMinutes, `Crucial block by ${dot.name}!`);
                    }
                    continue;
                  }
                  const tackleOdds = 0.16 + (dot.def / 100) * 0.34 + aggFactor * 0.22 - (ownerDot ? (ownerDot.dri / 100) * 0.14 : 0);
                  if (!ball.ownerId || (ball.lastTouchTeam !== dot.team && rng() < tackleOdds)) {
                    if (ball.ownerId && ball.lastTouchTeam !== dot.team) {
                      if (!ambientOnly && rng() < 0.015 + aggFactor * 0.045) {
                        audioFX.playWhistle('short');
                        audioFX.playCardBook();
                        dot.yellowCards += 1;
                        if (dot.yellowCards >= 2) {
                          dot.redCarded = true;
                          pushComment(state.elapsedMinutes, `RED CARD! ${dot.name} is sent off for a reckless tackle!`);
                        } else {
                          pushComment(state.elapsedMinutes, `YELLOW CARD! ${dot.name} booked for aggressive pressing.`);
                        }
                        ball.ownerId = null;
                        ball.vx = (dot.team === 'home' ? -1 : 1) * 140;
                        ball.vy = (rng() - 0.5) * 80;
                        ball.kickCooldown = 0.45;
                        state.freezeTicks = 18;
                        continue;
                      }
                    }
                    ball.ownerId = dot.id;
                    ball.lastTouchTeam = dot.team;
                    ball.z = 0;
                    ball.vz = 0;
                    ball.kickCooldown = 0.18;
                    state.carryTime = 0;
                    state.passTargetId = null;
                    state.shotInFlight = null;
                  }
                }
              }

              // Owner actions: GK distribution, kickoff back-pass, shoot, cross, dribble/pass
              if (ball.ownerId === dot.id) {
                ball.x = dot.x + (dot.team === 'home' ? 8 : -8);
                ball.y = dot.y;
                ball.vx = dot.vx;
                ball.vy = dot.vy;

                if (dot.role === 'GK') {
                  if (state.gkHoldTimer <= 0) {
                    const mates = state.dots.filter((m) => m.team === dot.team && m.id !== dot.id && !m.redCarded && m.role !== 'FWD');
                    const pool = mates.length > 0 ? mates : state.dots.filter((m) => m.team === dot.team && m.id !== dot.id && !m.redCarded);
                    if (pool.length > 0) {
                      const target = pool[Math.floor(rng() * pool.length)];
                      const pdx = target.x - dot.x;
                      const pdy = target.y - dot.y;
                      const pLen = Math.hypot(pdx, pdy) || 1;
                      const passSpeed = Math.min(420, 230 + pLen * 0.75);
                      ball.ownerId = null;
                      ball.vx = (pdx / pLen) * passSpeed;
                      ball.vy = (pdy / pLen) * passSpeed;
                      ball.vz = pLen > 240 ? 95 : 10;
                      ball.kickCooldown = 0.26;
                      state.passTargetId = target.id;
                      state.lastPassLine = { x1: dot.x, y1: dot.y, x2: target.x, y2: target.y };
                      state.passLineTimer = 0.24;
                      if (dot.team === 'home') state.homePasses += 1;
                      else state.awayPasses += 1;
                      if (!ambientOnly) audioFX.playKick(0.8);
                    }
                  }
                  continue;
                }

                if (state.kickoffTimer > 0) {
                  if (state.kickoffTimer < 0.35) {
                    const mids = state.dots.filter((m) => m.team === dot.team && m.id !== dot.id && !m.redCarded && m.role === 'MID');
                    const target = mids[0] || state.dots.find((m) => m.team === dot.team && m.id !== dot.id && !m.redCarded);
                    if (target) {
                      const pdx = target.x - dot.x;
                      const pdy = target.y - dot.y;
                      const pLen = Math.hypot(pdx, pdy) || 1;
                      ball.ownerId = null;
                      ball.vx = (pdx / pLen) * 240;
                      ball.vy = (pdy / pLen) * 240;
                      ball.vz = 5;
                      ball.kickCooldown = 0.24;
                      state.kickoffTimer = 0;
                      state.passTargetId = target.id;
                      state.lastPassLine = { x1: dot.x, y1: dot.y, x2: target.x, y2: target.y };
                      state.passLineTimer = 0.24;
                      if (dot.team === 'home') state.homePasses += 1;
                      else state.awayPasses += 1;
                      if (!ambientOnly) audioFX.playKick(0.75);
                    }
                  }
                  continue;
                }

                let nearestOppDist = Infinity;
                for (const opp of state.dots) {
                  if (opp.team === dot.team || opp.redCarded) continue;
                  const d = Math.hypot(opp.x - dot.x, opp.y - dot.y);
                  if (d < nearestOppDist) nearestOppDist = d;
                }

                const goalX = dot.team === 'home' ? PITCH_W - PAD_X : PAD_X;
                const distToGoal = Math.hypot(goalX - dot.x, PITCH_H * 0.5 - dot.y);
                const shootScale = 0.5 + (tac.shootIntensity / 100) * 1.1;
                const maxShotRange = PITCH_W * (0.17 + (tac.shootIntensity / 100) * 0.11 + (traits.includes('Long Shot') ? 0.04 : 0));
                const goodAngle = Math.abs(dot.y - PITCH_H * 0.5) < PITCH_H * 0.28;
                const roleShootBoost = dot.role === 'FWD' ? 1.35 : dot.role === 'DEF' ? 0.45 : 0.9;
                const shotProb = (distToGoal < PITCH_W * 0.13 ? 0.14 : 0.032 + (dot.sho / 100) * 0.048) * shootScale * roleShootBoost;

                if (state.carryTime > 0.18 && distToGoal < maxShotRange && goodAngle && rng() < shotProb) {
                  const spread = ((105 - dot.sho) / 100) * (PITCH_H * 0.13) + (nearestOppDist < 34 ? PITCH_H * 0.04 : 0);
                  const aimY = PITCH_H * 0.5 + (rng() - 0.5) * (goalBot - goalTop + spread * 2);
                  const sdx = goalX - dot.x;
                  const sdy = aimY - dot.y;
                  const sLen = Math.hypot(sdx, sdy) || 1;
                  const shotSpeed = 425 + dot.sho * 2.1;
                  ball.ownerId = null;
                  ball.vx = (sdx / sLen) * shotSpeed;
                  ball.vy = (sdy / sLen) * shotSpeed;
                  ball.vz = 18 + rng() * 45;
                  ball.kickCooldown = 0.28;
                  state.shotInFlight = { team: dot.team, shooterName: dot.name };
                  state.passTargetId = null;
                  if (dot.team === 'home') state.homeShots += 1;
                  else state.awayShots += 1;
                  if (!ambientOnly) {
                    audioFX.playKick(1.3);
                    pushComment(state.elapsedMinutes, `${dot.name} strikes toward goal!`);
                  }
                  continue;
                }

                // Flank Crossing mechanic
                const attackDir = dot.team === 'home' ? 1 : -1;
                const inAttackingThird = dot.team === 'home' ? dot.x > PITCH_W * 0.62 : dot.x < PITCH_W * 0.38;
                const inWideChannel = dot.y < PITCH_H * 0.38 || dot.y > PITCH_H * 0.62;
                const isCrosserPos = pos === 'LW' || pos === 'RW' || pos === 'LM' || pos === 'RM' || pos === 'LB' || pos === 'RB';
                const crossTraitBoost = traits.includes('Whipped Crosser') ? 1.45 : 1.0;
                const crossChance = (tac.crossIntensity / 100) * 0.14 * crossTraitBoost * (isCrosserPos ? 1.35 : 0.75);

                if (state.carryTime > 0.2 && inAttackingThird && inWideChannel && rng() < crossChance) {
                  const boxTargets = state.dots.filter(
                    (m) => m.team === dot.team && m.id !== dot.id && !m.redCarded && m.role !== 'GK' && (m.role === 'FWD' || m.pos === 'CAM' || m.pos === 'CM')
                  );
                  if (boxTargets.length > 0) {
                    const target = boxTargets.find((m) => m.pos === 'ST') || boxTargets[0];
                    const targetBoxX = dot.team === 'home' ? Math.max(target.x, PITCH_W - PAD_X - 155) : Math.min(target.x, PAD_X + 155);
                    const targetBoxY = PITCH_H * 0.5 + (rng() - 0.5) * 110;
                    const cdx = targetBoxX - dot.x;
                    const cdy = targetBoxY - dot.y;
                    const cLen = Math.hypot(cdx, cdy) || 1;
                    const crossSpeed = Math.min(470, 290 + cLen * 0.55);
                    ball.ownerId = null;
                    ball.vx = (cdx / cLen) * crossSpeed;
                    ball.vy = (cdy / cLen) * crossSpeed;
                    ball.vz = 145 + rng() * 35;
                    ball.kickCooldown = 0.28;
                    state.passTargetId = target.id;
                    state.lastPassLine = { x1: dot.x, y1: dot.y, x2: targetBoxX, y2: targetBoxY };
                    state.passLineTimer = 0.32;
                    if (dot.team === 'home') {
                      state.homeCrosses += 1;
                      state.homePasses += 1;
                    } else {
                      state.awayCrosses += 1;
                      state.awayPasses += 1;
                    }
                    if (!ambientOnly) {
                      audioFX.playKick(1.05);
                      pushComment(state.elapsedMinutes, `${dot.name} whips a dangerous cross into the box!`);
                    }
                    continue;
                  }
                }

                // Realistic Dribble vs Pass: hold & carry longer, reduce ping-pong passing
                const underPressure = nearestOppDist < 42;
                const minCarryForDribble = 0.42 + (tac.dribbleTendency / 100) * 0.55 - (tac.passIntensity / 100) * 0.28 + (traits.includes('Speed Dribbler') ? 0.16 : 0);
                if (state.carryTime < minCarryForDribble && !underPressure) {
                  continue;
                }

                const rolePassBias = dot.role === 'DEF' ? 1.25 : pos === 'CM' || pos === 'CAM' ? 1.15 : pos === 'ST' ? 0.65 : 0.9;
                const passTacScale = 0.28 + (tac.passIntensity / 100) * 1.15 - (tac.dribbleTendency / 100) * 0.35;
                const basePassProb = (state.carryTime > 0.7 ? 0.024 : 0.008) + (dot.pas / 100) * 0.018 + (underPressure ? 0.055 : 0);
                const passChance = Math.max(0.004, basePassProb * Math.max(0.2, passTacScale) * rolePassBias);

                if (rng() < passChance) {
                  const mates = state.dots.filter((m) => m.team === dot.team && m.id !== dot.id && !m.redCarded && m.role !== 'GK');
                  if (mates.length > 0) {
                    let bestMate = mates[0];
                    let bestScore = -Infinity;
                    for (const m of mates) {
                      const progress = (m.x - dot.x) * attackDir;
                      const distM = Math.hypot(m.x - dot.x, m.y - dot.y);
                      if (distM < 38) continue;
                      let minLaneOpp = Infinity;
                      let minRecOpp = Infinity;
                      for (const opp of state.dots) {
                        if (opp.team === dot.team || opp.redCarded) continue;
                        const dLane = distPointToSeg2D(opp.x, opp.y, dot.x, dot.y, m.x, m.y);
                        if (dLane < minLaneOpp) minLaneOpp = dLane;
                        const dRec = Math.hypot(opp.x - m.x, opp.y - m.y);
                        if (dRec < minRecOpp) minRecOpp = dRec;
                      }
                      let score = progress * 0.55 + Math.min(90, minRecOpp) * 1.1 + (minLaneOpp < 20 ? -160 : minLaneOpp * 0.8);
                      if (underPressure && progress < 0) score += 45;
                      if (traits.includes('Playmaker') && progress > 40) score += 35;
                      if (score > bestScore) {
                        bestScore = score;
                        bestMate = m;
                      }
                    }

                    if (!ambientOnly && bestMate.role === 'FWD' && (bestMate.x - dot.x) * attackDir > 125 && rng() < 0.025) {
                      audioFX.playWhistle('short');
                      pushComment(state.elapsedMinutes, `OFFSIDE! ${bestMate.name} flagged just beyond the last line.`);
                      ball.ownerId = null;
                      ball.vx = 0;
                      ball.vy = 0;
                      ball.kickCooldown = 0.45;
                      state.freezeTicks = 14;
                      continue;
                    }

                    const err = ((100 - dot.pas) / 100) * 28;
                    const pdx = bestMate.x + bestMate.vx * 0.18 + (rng() - 0.5) * err - dot.x;
                    const pdy = bestMate.y + bestMate.vy * 0.18 + (rng() - 0.5) * err - dot.y;
                    const pLen = Math.hypot(pdx, pdy) || 1;
                    const passSpeed = Math.min(440, 235 + pLen * 0.78);
                    ball.ownerId = null;
                    ball.vx = (pdx / pLen) * passSpeed;
                    ball.vy = (pdy / pLen) * passSpeed;
                    ball.vz = pLen > 260 ? 85 : 6;
                    ball.kickCooldown = 0.25;
                    state.passTargetId = bestMate.id;
                    state.lastPassLine = { x1: dot.x, y1: dot.y, x2: bestMate.x, y2: bestMate.y };
                    state.passLineTimer = 0.24;
                    if (dot.team === 'home') state.homePasses += 1;
                    else state.awayPasses += 1;
                    if (!ambientOnly) audioFX.playKick(0.8);
                  }
                }
              }
            }
          };

          const drawPitch = (ctx) => {
            // 1 single cached background blit instead of 40+ fill/arc calls every frame
            ctx.drawImage(pitchBgCanvas, 0, 0);

            // Subtle offside line indicator
            const awayDefenders = state.dots
              .filter((d) => d.team === 'away' && !d.redCarded && d.role !== 'GK')
              .sort((a, b) => b.x - a.x);
            if (awayDefenders.length > 0) {
              const lineX = awayDefenders[0].x;
              ctx.save();
              ctx.setLineDash([5, 6]);
              ctx.strokeStyle = 'rgba(250, 204, 21, 0.2)';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(lineX, PAD_Y + 2);
              ctx.lineTo(lineX, PITCH_H - PAD_Y - 2);
              ctx.stroke();
              ctx.restore();
            }

            // Goals with ripple on score
            const gTop = PITCH_H * 0.415;
            const gH = PITCH_H * 0.17;
            const ripple = state.netRippleTimer > 0 ? Math.sin(state.flagPhase * 6) * 4 : 0;
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.fillRect(10 + ripple, gTop, 26, gH);
            ctx.strokeRect(10 + ripple, gTop, 26, gH);
            ctx.fillRect(PITCH_W - 36 + ripple, gTop, 26, gH);
            ctx.strokeRect(PITCH_W - 36 + ripple, gTop, 26, gH);

            // Animated Corner Flags
            const corners = [
              [PAD_X, PAD_Y],
              [PITCH_W - PAD_X, PAD_Y],
              [PAD_X, PITCH_H - PAD_Y],
              [PITCH_W - PAD_X, PITCH_H - PAD_Y],
            ];
            corners.forEach(([cx, cy], idx) => {
              const wave = Math.sin(state.flagPhase + idx) * 3;
              ctx.fillStyle = '#ffd600';
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.lineTo(cx + 9, cy - 4 + wave);
              ctx.lineTo(cx, cy - 9);
              ctx.closePath();
              ctx.fill();
            });

            // Pass/Cross line preview
            if (state.passLineTimer > 0 && state.lastPassLine) {
              ctx.save();
              ctx.setLineDash([5, 5]);
              ctx.strokeStyle = 'rgba(0, 230, 118, 0.52)';
              ctx.lineWidth = 1.8;
              ctx.beginPath();
              ctx.moveTo(state.lastPassLine.x1, state.lastPassLine.y1);
              ctx.lineTo(state.lastPassLine.x2, state.lastPassLine.y2);
              ctx.stroke();
              ctx.restore();
            }

            // 22 Proportionally Realistic Players
            for (const dot of state.dots) {
              if (dot.redCarded) continue;
              const isCarrier = state.ball.ownerId === dot.id;
              if (isCarrier) {
                ctx.strokeStyle = '#ffd600';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, 12.2, 0, Math.PI * 2);
                ctx.stroke();
              }

              ctx.fillStyle = 'rgba(0,0,0,0.4)';
              ctx.beginPath();
              ctx.ellipse(dot.x, dot.y + 6, 7, 3.5, 0, 0, Math.PI * 2);
              ctx.fill();

              ctx.fillStyle = dot.role === 'GK' ? (dot.team === 'home' ? '#facc15' : '#a855f7') : dot.team === 'home' ? '#0ea5e9' : awayKit;
              ctx.beginPath();
              ctx.arc(dot.x, dot.y, 7.8, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = dot.yellowCards > 0 ? '#ffd600' : '#ffffff';
              ctx.lineWidth = 1.6;
              ctx.stroke();

              ctx.fillStyle = dot.role === 'GK' && dot.team === 'home' ? '#0f172a' : '#ffffff';
              ctx.font = 'bold 8px monospace';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(String(dot.shirtNum), dot.x, dot.y + 0.5);

              if (isCarrier && !ambientOnly) {
                ctx.fillStyle = 'rgba(7,11,18,0.85)';
                ctx.fillRect(dot.x - 32, dot.y - 20, 64, 11);
                ctx.fillStyle = '#00e676';
                ctx.font = 'bold 8px monospace';
                ctx.fillText(dot.name.slice(0, 10), dot.x, dot.y - 14.5);
              }
            }

            // Ball Shadow & Ball with Z height arc
            const b = state.ball;
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.beginPath();
            ctx.ellipse(b.x, b.y + 4, 5, 2.8, 0, 0, Math.PI * 2);
            ctx.fill();

            const scale = 1 + b.z * 0.011;
            const drawY = b.y - b.z * 0.42;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(b.x, drawY, 4.5 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1.4;
            ctx.stroke();

            if (state.goalBannerTimer > 0 && !ambientOnly) {
              ctx.fillStyle = 'rgba(7, 11, 18, 0.88)';
              ctx.fillRect(PITCH_W / 2 - 210, PITCH_H / 2 - 42, 420, 84);
              ctx.strokeStyle = '#ffd600';
              ctx.lineWidth = 4;
              ctx.strokeRect(PITCH_W / 2 - 210, PITCH_H / 2 - 42, 420, 84);
              ctx.fillStyle = '#ffd600';
              ctx.font = 'bold 32px "Press Start 2P", monospace';
              ctx.textAlign = 'center';
              ctx.fillText('GOOOAL!!', PITCH_W / 2, PITCH_H / 2 + 2);
            }
          };

          const loop = (now) => {
            animId = 0;
            if (ambientOnly) {
              if (now - lastAmbientDraw < 45) {
                animId = requestAnimationFrame(loop);
                return;
              }
              const dt = Math.min((now - (lastAmbientDraw || now)) / 1000 || 0.045, 0.05);
              lastAmbientDraw = now;
              stepSim(dt);
              const canvas = canvasRef.current;
              if (canvas) {
                const ctx = canvas.getContext('2d');
                if (ctx) drawPitch(ctx);
              }
              animId = requestAnimationFrame(loop);
              return;
            }

            if (pausedRef.current) {
              lastTime = performance.now();
              return;
            }

            const rawDt = (now - lastTime) / 1000;
            lastTime = now;
            const dt = Math.min(rawDt, 0.05);

            if (!state.finished) {
              const mult = speedRef.current;
              for (let s = 0; s < mult; s++) {
                stepSim(dt);
              }
            }

            const canvas = canvasRef.current;
            if (canvas) {
              const ctx = canvas.getContext('2d');
              if (ctx) drawPitch(ctx);
            }

            hudSyncAccum += dt;
            if (hudSyncAccum >= 0.16) {
              hudSyncAccum = 0;
              const totalP = state.homePossTicks + state.awayPossTicks;
              const min = Math.min(90, Math.floor(state.elapsedMinutes));
              const poss = Math.round((state.homePossTicks / totalP) * 100);
              const sig = `${min}|${state.homeScore}|${state.awayScore}|${state.homeShots}|${state.awayShots}|${state.homePasses}|${state.awayPasses}|${state.homeCrosses}|${state.awayCrosses}|${state.homeDribbles}|${state.awayDribbles}|${poss}|${lastCommentary}`;
              if (sig !== lastHudSig) {
                lastHudSig = sig;
                setHud({
                  minute: min,
                  homeScore: state.homeScore,
                  awayScore: state.awayScore,
                  homeShots: state.homeShots,
                  awayShots: state.awayShots,
                  homePasses: state.homePasses,
                  awayPasses: state.awayPasses,
                  homeCrosses: state.homeCrosses,
                  awayCrosses: state.awayCrosses,
                  homeDribbles: state.homeDribbles,
                  awayDribbles: state.awayDribbles,
                  homePoss: poss,
                  commentary: lastCommentary,
                });
                if (roomSyncRef && roomSyncRef.current) {
                  roomSyncRef.current({
                    minute: min,
                    homeScore: state.homeScore,
                    awayScore: state.awayScore,
                  });
                }
              }
            }

            if (!state.finished && !pausedRef.current) {
              animId = requestAnimationFrame(loop);
            }
          };

          const initCanvas = canvasRef.current;
          if (initCanvas) {
            const initCtx = initCanvas.getContext('2d');
            if (initCtx) drawPitch(initCtx);
          }

          loopKickRef.current = () => {
            if (!animId && !pausedRef.current && !state.finished) {
              lastTime = performance.now();
              animId = requestAnimationFrame(loop);
            }
          };

          if (!pausedRef.current) {
            animId = requestAnimationFrame(loop);
          }
          return () => {
            loopKickRef.current = null;
            if (animId) cancelAnimationFrame(animId);
          };
        }, [seed, ambientOnly, homeFormation, awayFormation, awayKit, awayBoost]);

        useEffect(() => {
          if (!paused && loopKickRef.current) {
            loopKickRef.current();
          }
        }, [paused]);

        if (ambientOnly) {
          return (
            <canvas
              ref={canvasRef}
              width={1280}
              height={760}
              className="w-full h-full object-cover opacity-45"
              data-testid="ambient-pitch-canvas"
            />
          );
        }

        return (
          <div className="flex flex-col gap-2.5 w-full max-w-5xl mx-auto">
            {/* Live Scoreboard HUD */}
            <div className="pixel-panel px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-4">
                <div className="text-right">
                  <div className="text-xs text-sky-400 font-bold">{homeName}</div>
                  <div className="text-[10px] text-slate-400 tabular-nums">
                    POSS {hud.homePoss}% · SH {hud.homeShots} · PAS {hud.homePasses} · CRS {hud.homeCrosses} · DRB {hud.homeDribbles}
                  </div>
                </div>
                <div className="px-4 py-1 bg-slate-950 border-2 border-emerald-400 font-arcade text-lg text-white tabular-nums">
                  {hud.homeScore} - {hud.awayScore}
                </div>
                <div className="text-left">
                  <div className="text-xs text-rose-400 font-bold">{awayName}</div>
                  <div className="text-[10px] text-slate-400 tabular-nums">
                    POSS {100 - hud.homePoss}% · SH {hud.awayShots} · PAS {hud.awayPasses} · CRS {hud.awayCrosses} · DRB {hud.awayDribbles}
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <span className="px-3 py-1 bg-slate-950 border border-amber-400 font-arcade text-xs text-amber-300 tabular-nums">
                  {String(hud.minute).padStart(2, '0')}&apos;
                </span>
                {[1, 2, 4].map((spd) => (
                  <button
                    key={spd}
                    type="button"
                    onClick={() => {
                      audioFX.playClick();
                      setSpeed(spd);
                    }}
                    className={`px-2.5 py-1 text-xs font-bold pixel-btn ${
                      speed === spd ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300'
                    }`}
                  >
                    {spd}X
                  </button>
                ))}
                {onOpenTactics && (
                  <button
                    type="button"
                    onClick={() => {
                      audioFX.playClick();
                      onOpenTactics();
                    }}
                    className="px-3 py-1 text-xs bg-amber-400 text-slate-950 font-bold pixel-btn"
                  >
                    TACTICS
                  </button>
                )}
                {onPauseToggle && (
                  <button
                    type="button"
                    onClick={() => {
                      audioFX.playClick();
                      onPauseToggle();
                    }}
                    className="px-3 py-1 text-xs bg-slate-800 text-slate-200 pixel-btn"
                  >
                    PAUSE [P]
                  </button>
                )}
              </div>
            </div>

            {/* Possession Meter Bar */}
            <div className="h-2 w-full bg-rose-500 border border-black overflow-hidden flex">
              <div className="bg-sky-400 h-full transition-all duration-150" style={{ width: `${hud.homePoss}%` }} />
            </div>

            {/* Interactive 2D Pitch Canvas (Spacious 1280x760 Football Pitch) */}
            <div className="relative border-4 border-slate-800 bg-[#0b4728] shadow-2xl overflow-hidden mx-auto w-full max-w-[920px]">
              <canvas
                ref={canvasRef}
                width={1280}
                height={760}
                className="w-full aspect-[1280/760] block"
                data-testid="match-pitch-canvas"
              />
            </div>

            {/* Live 8-Bit Commentary Ticker */}
            <div className="pixel-panel px-4 py-2">
              <div className="font-vt text-xl text-emerald-400 tracking-wide truncate">{hud.commentary}</div>
              <div className="mt-0.5 flex flex-col gap-0.5 max-h-14 overflow-y-auto font-vt text-base text-slate-400">
                {tickerLog.slice(1, 4).map((line, idx) => (
                  <div key={idx} className="truncate">
                    {line}
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      /* =========================================================================
         8. PENALTY SHOOTOUT SUDDEN-DEATH MINI-GAME
      ========================================================================= */
      function PenaltyShootoutGame({ striker, keeper, onComplete, onExit }) {
        const [phase, setPhase] = useState('SHOOT'); // 'SHOOT' | 'DIVE' | 'RESULT'
        const [round, setRound] = useState(1);
        const [playerGoals, setPlayerGoals] = useState(0);
        const [botGoals, setBotGoals] = useState(0);
        const [history, setHistory] = useState([]);
        const [message, setMessage] = useState('AIM A ZONE TO SHOOT!');
        const [lastBallPos, setLastBallPos] = useState({ x: 50, y: 80 });
        const [keeperPos, setKeeperPos] = useState(1); // 0 left, 1 center, 2 right
        const [locked, setLocked] = useState(false);

        const zones = [
          { id: 0, label: 'TOP LEFT', x: 18, y: 24, col: 0 },
          { id: 1, label: 'TOP CENTER', x: 50, y: 22, col: 1 },
          { id: 2, label: 'TOP RIGHT', x: 82, y: 24, col: 2 },
          { id: 3, label: 'BOT LEFT', x: 18, y: 74, col: 0 },
          { id: 4, label: 'BOT CENTER', x: 50, y: 74, col: 1 },
          { id: 5, label: 'BOT RIGHT', x: 82, y: 74, col: 2 },
        ];

        const diveLanes = [
          { col: 0, label: 'DIVE LEFT' },
          { col: 1, label: 'STAY CENTER' },
          { col: 2, label: 'DIVE RIGHT' },
        ];

        const rollNextCpuShot = () => {
          const aim = zones[Math.floor(Math.random() * zones.length)];
          // 75% honest striker body-lean telegraph, 25% subtle feint
          const honest = Math.random() < 0.75;
          const tellCol = honest ? aim.col : (aim.col + (Math.random() < 0.5 ? 1 : 2)) % 3;
          return { aim, tellCol };
        };

        const [cpuShot, setCpuShot] = useState(() => rollNextCpuShot());

        const checkFinish = (pG, bG, nextRound) => {
          const kicksLeft = Math.max(0, 5 - nextRound + 1);
          if (nextRound <= 5) {
            if (pG > bG + kicksLeft || bG > pG + kicksLeft) {
              return true;
            }
            return false;
          }
          return pG !== bG;
        };

        const handleShootZone = (zone) => {
          if (locked || phase !== 'SHOOT') return;
          setLocked(true);
          audioFX.playKick(1.2);

          const botDiveCol = Math.floor(Math.random() * 3);
          setKeeperPos(botDiveCol);
          setLastBallPos({ x: zone.x, y: zone.y });
          const accuracyBoost = (striker?.stats?.sho || 80) / 100;
          const saved = botDiveCol === zone.col && Math.random() > 0.34 * accuracyBoost;

          if (saved) {
            audioFX.playPostClang();
            setMessage('SAVED BY THE KEEPER!');
            setHistory((h) => [...h, `R${round}: YOU MISSED`]);
          } else {
            audioFX.playGoalRoar();
            setMessage(`GOOOAL! ${striker?.name || 'Striker'} buries it!`);
            setPlayerGoals((g) => g + 1);
            setHistory((h) => [...h, `R${round}: YOU SCORED`]);
          }

          setTimeout(() => {
            setCpuShot(rollNextCpuShot());
            setLastBallPos({ x: 50, y: 80 });
            setKeeperPos(1);
            setPhase('DIVE');
            setMessage('READ THE STRIKER & PICK A DIVE LANE!');
            setLocked(false);
          }, 900);
        };

        const handleDiveLane = (col) => {
          if (locked || phase !== 'DIVE') return;
          setLocked(true);
          audioFX.playKick(1.2);

          const botAim = cpuShot.aim;
          setKeeperPos(col);
          setLastBallPos({ x: botAim.x, y: botAim.y });
          // Guessing the right dive lane reliably saves the penalty!
          const saved = col === botAim.col;

          let nextBotGoals = botGoals;
          if (saved) {
            audioFX.playWhistle('short');
            setMessage(`BIG SAVE BY ${keeper?.name || 'KEEPER'}!`);
            setHistory((h) => [...h, `R${round}: SAVED CPU`]);
          } else {
            audioFX.playGoalRoar();
            nextBotGoals += 1;
            setBotGoals(nextBotGoals);
            setMessage('CPU SCORES!');
            setHistory((h) => [...h, `R${round}: CPU SCORED`]);
          }

          setTimeout(() => {
            const nextR = round + 1;
            if (checkFinish(playerGoals, nextBotGoals, nextR)) {
              setPhase('RESULT');
              const won = playerGoals > nextBotGoals;
              audioFX.playWhistle('fulltime');
              setMessage(won ? 'SHOOTOUT VICTORY!' : 'HEARTBREAK DEFEAT!');
              if (onComplete) onComplete(won, playerGoals, nextBotGoals);
            } else {
              setRound(nextR);
              setLastBallPos({ x: 50, y: 80 });
              setKeeperPos(1);
              setPhase('SHOOT');
              setMessage(nextR > 5 ? 'SUDDEN DEATH! AIM YOUR SHOT!' : 'AIM A ZONE TO SHOOT!');
            }
            setLocked(false);
          }, 900);
        };

        const tellLabel = cpuShot.tellCol === 0 ? 'STRIKER LEANS LEFT' : cpuShot.tellCol === 1 ? 'STRIKER EYES CENTER' : 'STRIKER OPENS RIGHT';

        return (
          <div className="max-w-3xl mx-auto flex flex-col gap-4">
            <div className="pixel-panel p-4 flex items-center justify-between gap-4">
              <div>
                <div className="font-arcade text-sm text-amber-300">PENALTY SHOOTOUT</div>
                <div className="font-vt text-xl text-slate-300">
                  Round {round} {round > 5 ? '(SUDDEN DEATH)' : 'of 5'} · {message}
                </div>
              </div>
              <div className="flex items-center gap-3">
                <div className="px-4 py-2 bg-slate-950 border-2 border-emerald-400 font-arcade text-lg tabular-nums">
                  {playerGoals} - {botGoals}
                </div>
                <button type="button" onClick={onExit} className="px-3 py-2 text-xs bg-slate-800 pixel-btn">
                  EXIT
                </button>
              </div>
            </div>

            {phase === 'DIVE' && (
              <div className="px-4 py-2 bg-slate-950 border-2 border-sky-400 flex items-center justify-between">
                <span className="font-arcade text-[10px] text-sky-300">KEEPER READ:</span>
                <span className="font-arcade text-xs text-amber-300">{tellLabel}</span>
              </div>
            )}

            {/* Interactive Goal Frame */}
            <div className="relative h-80 bg-[#0b4728] border-4 border-slate-700 overflow-hidden p-6 flex flex-col items-center justify-center gap-3">
              {/* Goal Net Frame */}
              <div className="relative w-full max-w-xl h-56 border-t-8 border-x-8 border-white bg-black/25">
                {phase === 'DIVE' ? (
                  <div className="w-full h-full grid grid-cols-3 gap-2 p-2">
                    {diveLanes.map((lane) => (
                      <button
                        key={lane.col}
                        type="button"
                        disabled={locked}
                        onClick={() => handleDiveLane(lane.col)}
                        className={`border-2 border-dashed flex flex-col items-center justify-center gap-2 text-xs font-bold transition-colors ${
                          cpuShot.tellCol === lane.col
                            ? 'border-amber-300/70 bg-amber-400/10 text-amber-200 hover:bg-emerald-400/25'
                            : 'border-white/35 text-white/85 hover:bg-emerald-400/25 hover:border-emerald-300'
                        }`}
                      >
                        <span>{lane.label}</span>
                        {cpuShot.tellCol === lane.col && (
                          <span className="text-[9px] text-amber-300">TELL</span>
                        )}
                      </button>
                    ))}
                  </div>
                ) : (
                  <div className="w-full h-full grid grid-cols-3 grid-rows-2 gap-2 p-2">
                    {zones.map((z) => (
                      <button
                        key={z.id}
                        type="button"
                        disabled={locked || phase === 'RESULT'}
                        onClick={() => handleShootZone(z)}
                        className="border border-dashed border-white/30 hover:bg-emerald-400/25 hover:border-emerald-300 flex items-center justify-center text-[10px] font-bold text-white/80 transition-colors"
                      >
                        {z.label}
                      </button>
                    ))}
                  </div>
                )}

                {/* Keeper Sprite */}
                <div
                  className="absolute bottom-2 w-12 h-16 bg-amber-400 border-2 border-black transition-all duration-200 pointer-events-none flex items-center justify-center text-[10px] font-bold text-black"
                  style={{ left: keeperPos === 0 ? '13%' : keeperPos === 1 ? '45%' : '77%' }}
                >
                  GK
                </div>

                {/* Ball Sprite */}
                <div
                  className="absolute w-6 h-6 rounded-full bg-white border-2 border-black transition-all duration-200 pointer-events-none"
                  style={{ left: `calc(${lastBallPos.x}% - 12px)`, top: `calc(${lastBallPos.y}% - 12px)` }}
                />
              </div>
            </div>

            <div className="pixel-panel p-3 flex flex-wrap gap-3 text-xs text-slate-300 font-vt text-lg">
              {history.length === 0 ? <span>No kicks taken yet.</span> : history.map((h, i) => <span key={i}>{h}</span>)}
            </div>
          </div>
        );
      }

      function parseFirebaseConfigInput(raw) {
        const cleaned = raw.trim();
        if (!cleaned) return null;
        try {
          return JSON.parse(cleaned);
        } catch {
          const out = {};
          const keys = ['apiKey', 'authDomain', 'databaseURL', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];
          keys.forEach((k) => {
            const m = cleaned.match(new RegExp(`${k}\\s*:\\s*["']([^"']+)["']`));
            if (m) out[k] = m[1];
          });
          return Object.keys(out).length ? out : null;
        }
      }

      function FirebaseConfigModal({ currentConfig, connected, fbError, onSave, onUseOffline, onClose }) {
        const [rawJson, setRawJson] = useState(
          JSON.stringify(currentConfig || DEFAULT_FIREBASE_CONFIG, null, 2)
        );
        const [error, setError] = useState('');

        const handleConnect = (e) => {
          e.preventDefault();
          setError('');
          const parsed = parseFirebaseConfigInput(rawJson);
          if (!parsed) {
            setError('Paste a valid Firebase Web Config JSON (with apiKey & databaseURL).');
            return;
          }
          if (!parsed.apiKey || !parsed.databaseURL) {
            setError('Config must include "apiKey" and "databaseURL" for Realtime Database.');
            return;
          }
          onSave(parsed);
        };

        return (
          <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="Firebase Online Setup">
            <div className="pixel-panel max-w-lg w-full p-5 flex flex-col gap-4">
              <div className="flex items-center justify-between">
                <h2 className="font-arcade text-sm text-emerald-400">MULTIPLAYER NETWORK SETUP</h2>
                <button type="button" onClick={onClose} className="px-2 py-1 text-xs bg-slate-800 pixel-btn">
                  X
                </button>

         9B. USERNAME & PASSWORD ACCOUNTS (SALTED SHA-256 + FIREBASE RTDB)
      ========================================================================= */
      const SESSION_STORAGE_KEY = 'pixel_kick_fc_session_v1';
      const LOCAL_ACCOUNTS_KEY = 'pixel_kick_fc_local_accounts_v1';
      const GUEST_ID_KEY = 'pixel_kick_fc_guest_id_v1';

      function randomSaltHex() {
        const bytes = new Uint8Array(12);
        if (window.crypto && window.crypto.getRandomValues) {
          window.crypto.getRandomValues(bytes);
        } else {
          for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
        }
        return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
      }

      async function hashPassword(password, salt) {
        const payload = `pkfc:${salt}:${password}`;
        if (window.crypto && window.crypto.subtle) {
          const enc = new TextEncoder().encode(payload);
          const buf = await window.crypto.subtle.digest('SHA-256', enc);
          return Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, '0')).join('');
        }
        let h1 = 2166136261;
        let h2 = 3735928559;
        for (let i = 0; i < payload.length; i++) {
          const ch = payload.charCodeAt(i);
          h1 = Math.imul(h1 ^ ch, 16777619);
          h2 = Math.imul(h2 ^ (ch + i), 2654435761);
        }
        return `${(h1 >>> 0).toString(16).padStart(8, '0')}${(h2 >>> 0).toString(16).padStart(8, '0')}`;
      }

      function normalizeUsername(raw) {
        const display = (raw || '').trim();
        const key = display.toLowerCase();
        return { display, key };
      }

      function validateAccountInput(username, password) {
        const { display, key } = normalizeUsername(username);
        if (!/^[a-z0-9_-]{3,18}$/.test(key)) {
          return 'Username must be 3-18 characters (letters, numbers, _ or -).';
        }
        if (!password || password.length < 4) {
          return 'Password must be at least 4 characters.';
        }
        return null;
      }

      function getOrCreateGuestId() {
        try {
          let gid = localStorage.getItem(GUEST_ID_KEY);
          if (!gid) {
            gid = `guest_${randomSaltHex().slice(0, 10)}`;
            localStorage.setItem(GUEST_ID_KEY, gid);
          }
          return gid;
        } catch {
          return `guest_${Math.floor(Math.random() * 1000000)}`;
        }
      }

      function loadInitialSession() {
        try {
          const raw = localStorage.getItem(SESSION_STORAGE_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          return parsed && parsed.usernameKey ? parsed : null;
        } catch {
          return null;
        }

          return list.sort((a, b) => (sortOrder === 'OVR_ASC' ? a.ovr - b.ovr : b.ovr - a.ovr));
        }, [tierFilter, posFilter, search, sortOrder, matchesCardQuery]);

        const rivalListings = useMemo(() => {
          const seeds = ['p411', 'p366', 'p248', 'p120'];
          return seeds
            .map((cid, idx) => {
              const card = CARD_BY_ID[cid] || PLAYER_POOL[idx * 25];

              return {
                id: `npc_mkt_${card.id}`,
                cardId: card.id,
                sellerKey: 'npc_market_rival',
                sellerName: ['PixelBroker', 'RetroScout', 'ArcadeBids', 'KitCollector'][idx],
                priceShards: price,
                isRival: true,
              };
            })
            .filter(Boolean);
        }, []);

        const allMarketListings = useMemo(() => {
          return [...marketListings, ...rivalListings];
        }, [marketListings, rivalListings]);

        const rivalTrades = useMemo(() => {
          const c1 = CARD_BY_ID['p365'] || PLAYER_POOL[80];
          const c2 = CARD_BY_ID['p285'] || PLAYER_POOL[140];
          return [

              wantedNote: 'Any 1 Silver or Gold card (66+ OVR)',
              minReturnOvr: 66,
              isRival: true,

            c2 && {

              offeredShards: 35,

        const visibleTrades = useMemo(() => {
          const q = tradeCodeLookup.trim().toUpperCase();
          const all = [...tradeOffers, ...rivalTrades];

            {notice && (

            {/* 2. SELL FOR SHARDS */}
            {subTab === 'SELL' && (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
